/* ============================================================
   MW 销售工程师训练营 · 站点样式
   移动优先，无外部依赖，file:// 直接可用
   ============================================================ */

:root{
  --bg:#f5f8fc; --panel:#ffffff; --panel-2:#fbfcfe;
  --ink:#0e1726; --ink-2:#33445c; --muted:#5f7189;
  --line:#e2e9f3; --line-2:#cfdae9;
  --brand:#0f766e; --brand-2:#14b8a6; --brand-soft:#e6f6f3;
  --accent:#b45309; --accent-soft:#fdf3e3;
  --blue:#1d4ed8; --blue-soft:#eaf0ff;
  --danger:#b91c1c;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px -12px rgba(15,23,42,.15);
  --shadow-lg:0 20px 50px -24px rgba(15,23,42,.28);
  --r:16px; --r-sm:10px;
  --max:1120px;
  --font:"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Code",Consolas,"SF Mono",monospace;
}
html[data-theme="dark"]{
  --bg:#080f19; --panel:#0f1a29; --panel-2:#0c1522;
  --ink:#e8eff9; --ink-2:#c2d0e2; --muted:#8fa1b8;
  --line:#1b2a3e; --line-2:#26374e;
  --brand:#2dd4bf; --brand-2:#5eead4; --brand-soft:#0d2b2a;
  --accent:#fbbf24; --accent-soft:#2a2110;
  --blue:#7aa2ff; --blue-soft:#141f38;
  --danger:#f87171;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -16px rgba(0,0,0,.6);
  --shadow-lg:0 24px 60px -28px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:16px;line-height:1.75;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.55;
  background:
    radial-gradient(760px 420px at 8% -8%, rgba(20,184,166,.12), transparent 62%),
    radial-gradient(700px 420px at 100% 0%, rgba(37,99,235,.09), transparent 58%);
}
img,svg{max-width:100%;display:block}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit}
b,strong{font-weight:650}
code{font-family:var(--mono);font-size:.88em;background:var(--panel-2);border:1px solid var(--line);padding:1px 6px;border-radius:6px;color:var(--brand)}
sub,sup{font-size:.7em}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}

/* ---------- 顶部进度条 ---------- */
.scroll-progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:90;background:transparent}
.scroll-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--brand-2));transition:width .12s linear}

/* ---------- 头部 ---------- */
.hdr{
  position:sticky;top:0;z-index:70;
  background:var(--bg);
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:saturate(1.4) blur(14px);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line);
}
.hdr-in{
  max-width:var(--max);margin:0 auto;padding:10px clamp(14px,3vw,24px);
  display:flex;align-items:center;gap:16px;
}
.brand{display:flex;align-items:center;gap:10px;color:inherit;min-width:0}
.brand:hover{text-decoration:none}
.brand-mark{
  width:38px;height:38px;flex:0 0 38px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--brand),var(--brand-2));color:#04231f;
  font-weight:800;font-size:13px;letter-spacing:.4px;box-shadow:var(--shadow);
}
.brand-txt{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.brand-txt b{font-size:14.5px;letter-spacing:.2px;white-space:nowrap}
.brand-txt i{font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{
  padding:7px 13px;border-radius:9px;color:var(--ink-2);font-size:13.5px;font-weight:500;
  transition:background .16s,color .16s;white-space:nowrap;
}
.nav a:hover{background:var(--panel);color:var(--ink);text-decoration:none}
.nav a.on{background:var(--brand-soft);color:var(--brand);font-weight:650}
.hdr-right{display:flex;align-items:center;gap:8px}
.hdr-progress{
  font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);
  border:1px solid var(--line);background:var(--panel);padding:4px 10px;border-radius:99px;white-space:nowrap;
}
.icon-btn{
  width:38px;height:38px;display:grid;place-items:center;border-radius:10px;cursor:pointer;
  background:var(--panel);border:1px solid var(--line);color:var(--ink-2);transition:.16s;
}
.icon-btn:hover{border-color:var(--line-2);color:var(--ink);transform:translateY(-1px)}

/* ---------- 布局 ---------- */
.app{max-width:var(--max);margin:0 auto;padding:clamp(18px,3vw,32px) clamp(14px,3vw,24px) 120px;min-height:60vh}
.foot{border-top:1px solid var(--line);background:var(--panel-2)}
.foot-in{max-width:var(--max);margin:0 auto;padding:22px clamp(14px,3vw,24px) 90px;color:var(--muted);font-size:12.5px}
.foot p{margin:0 0 4px}
.foot .fine{font-size:11.5px;opacity:.85}

/* ---------- 首页 ---------- */
.hero{
  position:relative;overflow:hidden;border-radius:22px;padding:clamp(24px,4.4vw,44px);
  background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 12%,var(--panel)),var(--panel) 62%);
  border:1px solid var(--line);box-shadow:var(--shadow);
}
.hero::after{
  content:"";position:absolute;right:-90px;top:-110px;width:320px;height:320px;border-radius:50%;
  background:radial-gradient(circle,rgba(20,184,166,.22),transparent 68%);pointer-events:none;
}
.eyebrow{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--brand);font-weight:700;margin:0 0 10px}
.hero h1{
  margin:0 0 12px;font-size:clamp(24px,4.6vw,40px);line-height:1.24;letter-spacing:-.2px;font-weight:750;
}
.hero h1 em{font-style:normal;color:var(--brand)}
.hero p{margin:0;color:var(--ink-2);font-size:clamp(14px,1.6vw,16px);max-width:58ch}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.btn{
  display:inline-flex;align-items:center;gap:8px;border-radius:11px;padding:11px 18px;
  font-size:14px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:.16s;
  text-decoration:none;line-height:1.2;min-height:44px;
}
.btn:hover{text-decoration:none;transform:translateY(-1px)}
.btn-primary{background:linear-gradient(180deg,var(--brand-2),var(--brand));color:#04231f;box-shadow:0 8px 20px -12px rgba(15,118,110,.8)}
.btn-ghost{background:var(--panel);border-color:var(--line-2);color:var(--ink)}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn-sm{padding:7px 12px;font-size:12.5px;min-height:34px;border-radius:9px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:clamp(20px,2.6vw,26px);line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted);letter-spacing:.3px}

.section{margin-top:34px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.section-h h2{margin:0;font-size:clamp(17px,2.2vw,20px);letter-spacing:.2px}
.section-h .more{font-size:12.5px;color:var(--muted)}

/* 今日卡片 */
.today{
  display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;
  border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3vw,26px);
  background:linear-gradient(120deg,var(--panel),var(--panel-2));box-shadow:var(--shadow);
  position:relative;overflow:hidden;
}
.today::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--brand-2),var(--brand))}
.today-tag{
  display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.6px;
  color:var(--brand);background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand) 25%,transparent);
  padding:3px 10px;border-radius:99px;margin-bottom:10px;
}
.today h3{margin:0 0 6px;font-size:clamp(17px,2.4vw,21px);line-height:1.35}
.today p{margin:0;color:var(--muted);font-size:13.5px}
.today-meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
.today-meta span{display:inline-flex;align-items:center;gap:5px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--brand);display:inline-block}

/* 周列表 */
.weeks{display:grid;gap:12px}
.week{border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden;box-shadow:var(--shadow)}
.week-h{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.week-n{
  flex:0 0 auto;font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--brand);
  background:var(--brand-soft);border-radius:8px;padding:4px 9px;
}
.week-h h3{margin:0;font-size:14.5px;flex:1;min-width:0}
.week-h .cnt{font-size:11.5px;color:var(--muted);white-space:nowrap}
.lessons{list-style:none;margin:0;padding:6px}
.lesson-row{
  display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:11px;
  color:var(--ink-2);transition:background .14s;text-decoration:none;
}
a.lesson-row:hover{background:var(--panel-2);text-decoration:none}
.lesson-row .idx{
  flex:0 0 30px;height:30px;border-radius:9px;display:grid;place-items:center;
  font-size:11.5px;font-weight:700;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.lesson-row .t{flex:1;min-width:0;font-size:13.5px;line-height:1.45}
.lesson-row .t small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.lesson-row .st{font-size:11px;color:var(--muted);white-space:nowrap}
.lesson-row.done .idx{background:var(--brand);border-color:var(--brand);color:#04231f}
.lesson-row.done .st{color:var(--brand);font-weight:600}
.lesson-row.today{background:var(--brand-soft)}
.lesson-row.today .idx{background:linear-gradient(180deg,var(--brand-2),var(--brand));color:#04231f;border-color:transparent}
.lesson-row.locked{opacity:.62;cursor:not-allowed}
.lesson-row.locked .st{color:var(--muted)}

/* ---------- 课程页 ---------- */
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.crumb a{color:var(--muted)}
.crumb a:hover{color:var(--brand)}

.lesson-wrap{display:grid;gap:28px;max-width:1040px;margin:0 auto}
@media(min-width:1000px){
  .lesson-wrap{grid-template-columns:236px minmax(0,1fr);align-items:start}
}
.toc{
  border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:14px;
  box-shadow:var(--shadow);font-size:12.8px;
}
@media(min-width:1000px){.toc{position:sticky;top:80px}}
.toc h4{margin:0 0 8px;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.toc ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.toc a{display:block;padding:6px 8px;border-radius:8px;color:var(--ink-2);line-height:1.45}
.toc a:hover{background:var(--panel-2);text-decoration:none;color:var(--brand)}
.toc .toc-prog{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);color:var(--muted);font-size:11.5px}

.article{max-width:760px;min-width:0}
.art-head{border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:24px}
.art-kicker{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:11.5px;color:var(--muted);margin-bottom:10px}
.chip{
  font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;
  background:var(--panel-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap;
}
.chip.brand{background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand) 25%,transparent);color:var(--brand)}
.chip.warm{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 25%,transparent);color:var(--accent)}
.art-head h1{margin:0 0 10px;font-size:clamp(23px,4vw,34px);line-height:1.28;letter-spacing:-.2px;font-weight:750}
.art-head .sub{margin:0;color:var(--ink-2);font-size:15px}

.objectives{
  border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:12px;
  background:var(--panel);padding:14px 16px;margin:0 0 26px;
}
.objectives h4{margin:0 0 8px;font-size:12px;letter-spacing:1px;color:var(--brand);text-transform:uppercase}
.objectives ol{margin:0;padding-left:20px;color:var(--ink-2);font-size:13.8px}
.objectives li{margin:5px 0}

.article h2{
  margin:40px 0 12px;font-size:clamp(18px,2.6vw,22px);line-height:1.4;letter-spacing:.1px;
  scroll-margin-top:84px;font-weight:700;
}
.article h3{margin:26px 0 8px;font-size:16.5px;scroll-margin-top:84px}
.article p{margin:0 0 14px;color:var(--ink-2);font-size:15.5px}
.article p.lead{font-size:16.5px;color:var(--ink)}
.article ul,.article ol{margin:0 0 16px;padding-left:22px;color:var(--ink-2);font-size:15.5px}
.article li{margin:7px 0}
.article li::marker{color:var(--brand)}

.callout{border:1px solid var(--line);border-radius:14px;padding:15px 17px;margin:20px 0;background:var(--panel)}
.callout .co-t{font-size:11.5px;font-weight:750;letter-spacing:.8px;margin-bottom:6px}
.callout p{margin:0;font-size:14.6px}
.callout.key{border-left:3px solid var(--brand);background:linear-gradient(180deg,var(--brand-soft),var(--panel) 70%)}
.callout.key .co-t{color:var(--brand)}
.callout.warn{border-left:3px solid var(--accent);background:linear-gradient(180deg,var(--accent-soft),var(--panel) 70%)}
.callout.warn .co-t{color:var(--accent)}
.callout.note{border-left:3px solid var(--blue);background:linear-gradient(180deg,var(--blue-soft),var(--panel) 70%)}
.callout.note .co-t{color:var(--blue)}

.quote{margin:20px 0;padding:14px 18px;border-left:3px solid var(--line-2);color:var(--muted);font-size:14.5px}

/* 表格 */
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:13px;margin:18px 0 10px;background:var(--panel)}
.tbl table{border-collapse:collapse;width:100%;min-width:560px;font-size:13.4px}
.tbl th{background:var(--panel-2);text-align:left;font-weight:650;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12.3px;color:var(--ink)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--panel-2)}
.tbl .dim{color:var(--muted);font-size:11.5px}
.fine{font-size:11.8px;color:var(--muted);line-height:1.65;margin:6px 0 0}

/* 卡片组 */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px;margin:18px 0}
.card{border:1px solid var(--line);border-radius:13px;padding:14px;background:var(--panel);transition:.16s}
.card:hover{border-color:var(--line-2);transform:translateY(-2px);box-shadow:var(--shadow)}
.card h4{margin:0 0 6px;font-size:14px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card p{margin:0;font-size:12.9px;color:var(--muted);line-height:1.62}

/* 步骤 */
.steps{list-style:none;padding:0;margin:18px 0;counter-reset:s}
.steps li{position:relative;padding:0 0 0 40px;margin:0 0 14px;counter-increment:s;color:var(--ink-2);font-size:15px}
.steps li::before{
  content:counter(s);position:absolute;left:0;top:1px;width:26px;height:26px;border-radius:9px;
  display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--brand);
  background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand) 22%,transparent);
}
.steps li b{display:block;color:var(--ink);margin-bottom:2px}

/* 键值 */
.kv{border:1px solid var(--line);border-radius:13px;overflow:hidden;margin:16px 0;background:var(--panel)}
.kv-row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.kv-row:last-child{border-bottom:0}
.kv-k{font-size:12.3px;font-weight:650;color:var(--brand)}
.kv-v{font-size:13.6px;color:var(--ink-2)}

/* 折叠 */
details.acc{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin:9px 0;overflow:hidden}
details.acc summary{
  cursor:pointer;padding:12px 15px;font-size:13.8px;font-weight:600;color:var(--ink);
  list-style:none;display:flex;align-items:center;gap:9px;
}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::before{content:"";width:6px;height:6px;border-right:2px solid var(--brand);border-bottom:2px solid var(--brand);transform:rotate(-45deg);transition:.2s;flex:0 0 auto}
details.acc[open] summary::before{transform:rotate(45deg)}
details.acc summary:hover{background:var(--panel-2)}
.acc-b{padding:0 15px 14px;color:var(--ink-2);font-size:14px;border-top:1px solid var(--line);padding-top:12px}

/* 测验 */
.quiz{display:grid;gap:9px;margin:16px 0}
details.q{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
details.q summary{cursor:pointer;padding:12px 15px;font-size:14px;list-style:none;display:flex;gap:10px;color:var(--ink)}
details.q summary::-webkit-details-marker{display:none}
details.q summary:hover{background:var(--panel-2)}
details.q .qn{color:var(--brand);font-weight:800;font-size:11.5px;flex:0 0 auto;padding-top:3px}
details.q .ans{padding:0 15px 14px;border-top:1px solid var(--line);padding-top:11px;font-size:13.8px;color:var(--ink-2)}
details.q .ans::before{content:"参考答案";display:block;font-size:10.5px;letter-spacing:1px;color:var(--accent);font-weight:700;margin-bottom:4px}

/* 图 */
figure.fig{margin:22px 0;border:1px solid var(--line);border-radius:15px;background:var(--panel);padding:14px;overflow:hidden}
figure.fig svg{width:100%;height:auto;display:block}
figure.fig figcaption{font-size:12px;color:var(--muted);margin-top:8px;text-align:center}
.fig-t{font-size:12.5px;font-weight:650;color:var(--ink);margin-bottom:8px;display:flex;gap:8px;align-items:center}
.fig-t span{font-weight:400;color:var(--muted);font-size:11.5px}

/* 工具/计算器 */
.widget{border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,var(--panel),var(--panel-2));padding:16px;margin:22px 0;box-shadow:var(--shadow)}
.widget-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px;flex-wrap:wrap}
.widget-h h4{margin:0;font-size:14px}
.widget-h .chip{font-size:10.5px}
.widget .hint{font-size:12px;color:var(--muted);margin:0 0 14px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.wfield{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted)}
.wfield input,.wfield select{
  width:100%;font-size:16px;font-family:inherit;padding:9px 10px;border-radius:9px;
  border:1px solid var(--line-2);background:var(--panel);color:var(--ink);min-height:42px;
}
.wfield input:focus,.wfield select:focus{outline:2px solid color-mix(in srgb,var(--brand) 45%,transparent);outline-offset:1px;border-color:var(--brand)}
.wout{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);display:grid;gap:2px}
.wrow{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:4px 0}
.wrow .k{color:var(--muted)}
.wrow .v{font-weight:650;font-variant-numeric:tabular-nums;text-align:right}
.wverdict{margin-top:8px;font-size:12.5px;padding:8px 10px;border-radius:9px;background:var(--panel);border:1px solid var(--line);color:var(--ink-2)}
.ok{color:var(--brand)}.mid{color:var(--accent)}.bad{color:var(--danger)}

.range{width:100%;margin:10px 0 0;accent-color:var(--brand)}

/* 课程底部 */
.art-foot{margin-top:38px;padding-top:20px;border-top:1px solid var(--line)}
.done-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.done-btn{
  display:inline-flex;align-items:center;gap:8px;border-radius:11px;padding:11px 18px;font-size:14px;font-weight:650;
  cursor:pointer;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);min-height:46px;
}
.done-btn.is-done{background:var(--brand);border-color:var(--brand);color:#04231f}
.nextnav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.nextnav a{
  display:block;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel);
  color:var(--ink);text-decoration:none;transition:.16s;min-height:64px;
}
.nextnav a:hover{border-color:var(--brand);text-decoration:none;transform:translateY(-1px)}
.nextnav .lbl{font-size:11px;color:var(--muted);letter-spacing:.6px}
.nextnav .tt{font-size:13.5px;font-weight:600;margin-top:3px;line-height:1.4}
.nextnav a.disabled{opacity:.5;pointer-events:none}

/* 锁定 */
.locked-view{text-align:center;padding:clamp(28px,6vw,60px) 18px;border:1px dashed var(--line-2);border-radius:18px;background:var(--panel)}
.locked-view .lock-ico{width:56px;height:56px;margin:0 auto 14px;border-radius:16px;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line);color:var(--muted)}
.locked-view h2{margin:0 0 8px;font-size:20px}
.locked-view p{margin:0 0 6px;color:var(--muted);font-size:14px}
.locked-view .when{font-size:13px;color:var(--brand);font-weight:650;margin:14px 0 20px}

/* 提示条 */
.toast{
  position:fixed;left:50%;bottom:88px;transform:translate(-50%,16px);z-index:95;
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:13px;
  opacity:0;pointer-events:none;transition:.24s;box-shadow:var(--shadow-lg);white-space:nowrap;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- 移动端 tabbar ---------- */
.tabbar{display:none}
@media(max-width:720px){
  .nav{display:none}
  .hdr-progress{display:none}
  .brand-txt i{display:none}
  .app{padding-bottom:104px}
  .foot-in{padding-bottom:104px}
  .today{grid-template-columns:1fr}
  .today .btn{width:100%;justify-content:center}
  .stats{grid-template-columns:1fr 1fr 1fr;gap:8px}
  .stat{padding:11px 12px}
  .stat b{font-size:19px}
  .nextnav{grid-template-columns:1fr}
  .lesson-wrap{gap:18px}
  .toc{order:-1}
  .toc ol{display:flex;flex-wrap:wrap;gap:4px}
  .toc a{font-size:12px;padding:5px 9px;background:var(--panel-2);border:1px solid var(--line)}
  .toc .toc-prog{display:none}
  .tabbar{
    display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:80;
    background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
  }
  .tabbar a{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    padding:9px 0 8px;color:var(--muted);font-size:10.5px;min-height:54px;text-decoration:none;
  }
  .tabbar a svg{width:21px;height:21px}
  .tabbar a.on{color:var(--brand)}
  .toast{bottom:76px}
}
@media(max-width:420px){
  .brand-txt b{font-size:13px}
  .hdr-in{gap:8px;padding:9px 12px}
  .hero{border-radius:18px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
@media print{
  .hdr,.tabbar,.foot,.toc,.done-row,.nextnav,.scroll-progress{display:none!important}
  body{background:#fff}
  .lesson-wrap{grid-template-columns:1fr}
  .article{max-width:none}
  .callout,.card,figure.fig,.tbl{break-inside:avoid}
}

/* ===== Quiz app (per-question answering) ===== */
.quizbox{margin-top:52px;border:1px solid var(--line);border-radius:22px;background:var(--panel);padding:clamp(18px,3vw,30px);box-shadow:var(--shadow);position:relative;overflow:hidden}
.quizbox::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--brand),var(--brand-2))}
.quiz-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.quiz-title{font-size:18px;font-weight:750;letter-spacing:.2px}
.quiz-sub{margin-left:10px;font-size:12px;font-weight:400;color:var(--muted)}
.quiz-best{font-size:12px;color:var(--brand);font-weight:650;background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand) 25%,transparent);padding:3px 11px;border-radius:99px}
.quiz-best:empty{display:none}
.quiz-bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.quiz-bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand-2));transition:width .35s cubic-bezier(.4,0,.2,1)}
.quiz-stage{margin-top:22px;min-height:340px}

.q-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);letter-spacing:.5px;margin-bottom:10px}
.q-num{font-weight:800;color:var(--brand);font-size:13px;letter-spacing:.3px}
.q-title{font-size:clamp(16.5px,2.4vw,20px);line-height:1.55;font-weight:650;margin:0 0 20px;letter-spacing:.1px}
.q-opts{display:grid;gap:10px}
.q-opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 17px;border-radius:15px;border:1.5px solid var(--line);background:var(--panel-2);font:inherit;font-size:15px;color:var(--ink);cursor:pointer;transition:all .18s;min-height:58px}
.q-opt:hover:not(:disabled){border-color:color-mix(in srgb,var(--brand) 55%,var(--line));background:var(--panel);transform:translateY(-1px);box-shadow:0 10px 22px -18px rgba(0,0,0,.55)}
.q-opt .k{flex:0 0 32px;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:800;background:var(--panel);border:1px solid var(--line);color:var(--muted);transition:all .18s}
.q-opt .t{flex:1;line-height:1.5}
.q-opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.q-opt.sel .k{background:var(--brand);border-color:var(--brand);color:#04231f}
.q-opt.ok{border-color:var(--brand);background:var(--brand-soft)}
.q-opt.ok .k{background:var(--brand);color:#04231f;border-color:var(--brand)}
.q-opt.bad{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 9%,var(--panel))}
.q-opt.bad .k{background:var(--danger);color:#fff;border-color:var(--danger)}
.q-opt:disabled{cursor:default;opacity:.96}

.q-fb{margin-top:16px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--panel-2);animation:fbIn .26s ease}
.q-fb.ok{border-color:color-mix(in srgb,var(--brand) 45%,var(--line));background:linear-gradient(180deg,var(--brand-soft),var(--panel))}
.q-fb.bad{border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.q-fb-h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:750;margin-bottom:6px}
.q-fb.ok .q-fb-h{color:var(--brand)}
.q-fb.bad .q-fb-h{color:var(--danger)}
.q-fb p{margin:0;font-size:13.8px;line-height:1.75;color:var(--ink-2)}
.q-fb p b{color:var(--ink)}
@keyframes fbIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.q-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.q-actions .btn{min-width:132px;justify-content:center}
.btn[disabled]{opacity:.42;cursor:not-allowed;transform:none!important;box-shadow:none!important}

.q-result{text-align:center;padding:6px 0 2px}
.q-ring{width:154px;height:154px;margin:6px auto 14px;position:relative}
.q-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.q-ring .track{fill:none;stroke:var(--line);stroke-width:10}
.q-ring .fill{fill:none;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.4,0,.2,1)}
.q-ring .val{position:absolute;inset:0;display:grid;place-items:center;font-size:38px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.q-ring .val span{font-size:14px;font-weight:600;color:var(--muted);margin-left:3px}
.q-result h3{margin:0 0 6px;font-size:21px;letter-spacing:.2px}
.q-sum{color:var(--muted);font-size:13.5px;margin:0 0 18px}
.q-result .q-actions{justify-content:center}
.q-review{margin-top:28px;text-align:left;border-top:1px dashed var(--line);padding-top:20px}
.q-review h4{margin:0 0 12px;font-size:14px;letter-spacing:.3px;color:var(--ink)}
.rv{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px;background:var(--panel-2)}
.rv.bad{border-left:3px solid var(--danger)}
.rv.ok{border-left:3px solid var(--brand)}
.rv-q{font-size:13.6px;font-weight:600;margin-bottom:6px;line-height:1.55}
.rv-a{font-size:12.4px;color:var(--muted);margin-bottom:6px}
.rv-a b{color:var(--ink)}
.rv-x{font-size:13px;color:var(--ink-2);line-height:1.72}
.rv-x b{color:var(--brand)}

@media(max-width:720px){
  .quizbox{padding:16px;border-radius:18px;margin-top:40px}
  .q-opt{padding:13px 14px;min-height:54px;font-size:14.6px;gap:12px}
  .q-opt .k{flex:0 0 28px;width:28px;height:28px;border-radius:9px;font-size:12px}
  .q-ring{width:128px;height:128px}
  .q-ring .val{font-size:31px}
  .q-actions .btn{flex:1 1 auto}
}

.tbl td{white-space:pre-line}

/* ================= MW brand layer ================= */
/* 閸濅胶澧濋懝鎻掑絿閼?MW 鐎规ɑ鏌熼弽鍥槕閿涙碍绻佸ù宄板晽閽?#001223 / 娣団€冲娇姒?#FFD600 / 閻?*/
:root{
  --bg:#F6F7F9; --panel:#FFFFFF; --panel-2:#FAFBFC;
  --ink:#001223; --ink-2:#31425A; --muted:#5C6B7E;
  --line:#E4E8EF; --line-2:#C9D3E0;
  --brand:#001223; --brand-2:#FFD600; --brand-soft:#FFF5C2;
  --accent:#B45309; --accent-soft:#FDF3E3;
  --blue:#1E3A8A; --blue-soft:#EAF0FB;
  --danger:#C62828;
  --mw-yellow:#FFD600; --mw-navy:#001223;
  --shadow:0 1px 2px rgba(0,18,35,.05),0 10px 28px -16px rgba(0,18,35,.22);
  --shadow-lg:0 24px 60px -30px rgba(0,18,35,.38);
}
html[data-theme="dark"]{
  --bg:#000A14; --panel:#061320; --panel-2:#0A1826;
  --ink:#F2F7FC; --ink-2:#C6D4E4; --muted:#8CA0B6;
  --line:#15263A; --line-2:#22374F;
  --brand:#FFD600; --brand-2:#FFE566; --brand-soft:rgba(255,214,0,.16);
  --accent:#F59E0B; --accent-soft:#2A2110;
  --blue:#7AA2FF; --blue-soft:#111E36;
  --danger:#FF6B6B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -18px rgba(0,0,0,.75);
  --shadow-lg:0 26px 64px -32px rgba(0,0,0,.85);
}

.brand-logo{width:38px;height:38px;flex:0 0 38px;border-radius:10px;display:block;box-shadow:0 8px 18px -12px rgba(0,18,35,.75)}
.brand-txt b{letter-spacing:.3px}

.btn-primary{background:var(--mw-yellow);color:var(--mw-navy);border-color:var(--mw-yellow);box-shadow:0 10px 24px -14px rgba(255,214,0,.95);font-weight:700}
.btn-primary:hover{filter:brightness(1.04);transform:translateY(-1px)}
.scroll-progress i{background:var(--mw-yellow)}

.hero{
  background:
    radial-gradient(900px 460px at 92% -25%,rgba(255,214,0,.18),transparent 62%),
    linear-gradient(142deg,#001223 0%,#07203A 58%,#001223 100%);
  border-color:transparent;
  box-shadow:0 34px 70px -46px rgba(0,18,35,.95);
}
.hero::after{background:radial-gradient(circle,rgba(255,214,0,.24),transparent 68%)}
.hero::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.06;
  background-image:repeating-linear-gradient(135deg,#FFD600 0 1px,transparent 1px 14px);
}
.hero .eyebrow{color:var(--mw-yellow);letter-spacing:2px}
.hero h1{color:#FFFFFF}
.hero h1 em{color:var(--mw-yellow);font-style:normal}
.hero p{color:#B7C6D8}
.hero .stat{background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.13);box-shadow:none}
.hero .stat b{color:#FFFFFF}
.hero .stat span{color:#8FA3B9}
.hero .btn-ghost{background:transparent;border-color:rgba(255,255,255,.28);color:#FFFFFF}
.hero .btn-ghost:hover{border-color:var(--mw-yellow);color:var(--mw-yellow);background:rgba(255,214,0,.08)}

.tab.active{background:var(--mw-navy);color:#FFFFFF;box-shadow:0 8px 18px -12px rgba(0,18,35,.8)}
html[data-theme="dark"] .tab.active{background:var(--mw-yellow);color:var(--mw-navy)}
.nav a.on{background:var(--brand-soft);color:var(--mw-navy);font-weight:700}
html[data-theme="dark"] .nav a.on{color:var(--mw-yellow)}

.chip.brand{background:var(--brand-soft);color:var(--mw-navy);border-color:rgba(0,18,35,.12)}
html[data-theme="dark"] .chip.brand{color:var(--mw-yellow);border-color:rgba(255,214,0,.25)}
.today-tag{background:var(--brand-soft);color:var(--mw-navy);border-color:rgba(0,18,35,.12)}
html[data-theme="dark"] .today-tag{color:var(--mw-yellow);border-color:rgba(255,214,0,.25)}
.today::before{background:var(--mw-yellow)}

.article h2{border-left:4px solid var(--mw-yellow);padding-left:13px;line-height:1.35}
.lesson-row.today .idx{background:var(--mw-yellow);color:var(--mw-navy);border-color:var(--mw-yellow)}
.lesson-row.done .idx{background:var(--mw-navy);border-color:var(--mw-navy);color:var(--mw-yellow)}
html[data-theme="dark"] .lesson-row.done .idx{background:var(--mw-yellow);color:var(--mw-navy);border-color:var(--mw-yellow)}

.quizbox::before{background:linear-gradient(90deg,var(--mw-yellow) 0 60%,var(--mw-navy) 60% 100%)}
html[data-theme="dark"] .quizbox::before{background:linear-gradient(90deg,var(--mw-yellow) 0 60%,#FFE566 60% 100%)}
.quiz-bar i{background:var(--mw-yellow)}
.q-opt.sel{border-color:var(--mw-navy);background:var(--brand-soft)}
html[data-theme="dark"] .q-opt.sel{border-color:var(--mw-yellow);background:var(--brand-soft)}
.q-opt.ok{border-color:var(--mw-navy);background:var(--brand-soft)}
html[data-theme="dark"] .q-opt.ok{border-color:var(--mw-yellow)}
.q-opt.sel .k,.q-opt.ok .k{background:var(--mw-yellow);border-color:var(--mw-yellow);color:var(--mw-navy)}

.done-btn.is-done{background:var(--mw-yellow);color:var(--mw-navy);border-color:var(--mw-yellow)}
.tabbar a.on{color:var(--mw-navy);font-weight:700}
html[data-theme="dark"] .tabbar a.on{color:var(--mw-yellow)}
.foot{border-top:3px solid var(--mw-yellow)}
.foot-brand{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-weight:700;color:var(--ink)}
.foot-brand img{width:26px;height:26px;border-radius:7px;display:block}
html[data-theme="dark"] .brand-logo{box-shadow:0 0 0 1px rgba(255,255,255,.10)}
.section-h h2{position:relative;padding-bottom:9px}
.section-h h2::after{content:"";position:absolute;left:0;bottom:0;width:28px;height:3px;border-radius:2px;background:var(--mw-yellow)}
html[data-theme="dark"] .lesson-row.today{background:rgba(255,214,0,.10)}



/* ============ 3D 实验室 v2 ============ */
.lab-head{max-width:1200px;margin:0 auto;padding:34px 24px 6px}
.lab-head h1{font-size:clamp(1.6rem,3vw,2.2rem);margin:0 0 8px;letter-spacing:-.02em}
.lab-head p{margin:0;color:var(--muted);max-width:72ch;line-height:1.7}
.lab-badge{display:inline-block;margin-bottom:10px;padding:4px 10px;border-radius:999px;background:#FFD600;color:#101820;font-size:.72rem;font-weight:800;letter-spacing:.08em}

.lab-grid{max-width:1200px;margin:16px auto 40px;padding:0 24px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(320px,.8fr);gap:18px;align-items:start}
@media(max-width:940px){.lab-grid{grid-template-columns:1fr;padding:0 16px}}

.lab-stage{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative}
.lab-tabs{display:flex;gap:6px;padding:10px 10px 0;flex-wrap:wrap}
.lab-tabs button{
  border:1px solid #cfd6df;background:#fff;color:#0e1726;border-radius:999px;
  padding:7px 14px;font:inherit;font-size:.85rem;font-weight:650;cursor:pointer;transition:.15s;
}
.lab-tabs button:hover{border-color:#101820}
.lab-tabs button.on{background:#101820;color:#FFD600;border-color:#101820}
html[data-theme="dark"] .lab-tabs button{background:#16202e;border-color:#2a3a4e;color:#dbe4ee}
html[data-theme="dark"] .lab-tabs button:hover{border-color:#FFD600}
html[data-theme="dark"] .lab-tabs button.on{background:#FFD600;color:#101820;border-color:#FFD600}

.lab-fams{display:flex;gap:6px;padding:8px 10px 0;flex-wrap:wrap}
.lab-fams button{
  border:1px dashed #cfd6df;background:transparent;color:#465468;border-radius:8px;
  padding:5px 11px;font:inherit;font-size:.78rem;cursor:pointer;transition:.15s;
}
.lab-fams button:hover{border-color:#101820;color:#101820}
.lab-fams button.on{background:#FFF6C9;border:1px solid #FFD600;color:#101820;font-weight:700}
html[data-theme="dark"] .lab-fams button{color:#a9b8ca;border-color:#33465c}
html[data-theme="dark"] .lab-fams button.on{background:#3a3208;border-color:#FFD600;color:#FFD600}

.lab-canvas-wrap{position:relative;aspect-ratio:4/3;min-height:320px;background:
  radial-gradient(120% 90% at 50% 18%,#ffffff 0%,#eef2f8 45%,#dfe6f0 100%)}
html[data-theme="dark"] .lab-canvas-wrap{background:radial-gradient(120% 90% at 50% 18%,#1c2940 0%,#111b2b 45%,#0a1220 100%)}
.lab-canvas-wrap canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.lab-canvas-wrap canvas:active{cursor:grabbing}
.lab-hud{position:absolute;left:12px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
.lab-hud span{background:rgba(8,18,32,.82);color:#fff;font-size:.72rem;padding:4px 9px;border-radius:6px;font-variant-numeric:tabular-nums}
.lab-tip{position:absolute;right:12px;top:12px;background:rgba(255,255,255,.9);color:#33445c;font-size:.72rem;padding:5px 9px;border-radius:6px}
html[data-theme="dark"] .lab-tip{background:rgba(10,20,34,.85);color:#c8d4e4}
.lab-spec{position:absolute;right:12px;bottom:46px;align-items:flex-end;display:flex;gap:6px;flex-direction:column}
.lab-spec b{background:#FFD600;color:#101820;font-size:.7rem;padding:3px 8px;border-radius:5px;letter-spacing:.04em}
.lab-spec i{font-style:normal;background:rgba(8,18,32,.8);color:#e7edf6;font-size:.7rem;padding:3px 8px;border-radius:5px}

.lab-legend{display:flex;gap:14px;padding:9px 14px;border-top:1px solid var(--line);font-size:.75rem;color:var(--muted);flex-wrap:wrap}
.lab-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.lab-legend .ok{background:#1f9d55}.lab-legend .warn{background:#d99a00}.lab-legend .bad{background:#d34a3a}

.lab-panel{display:flex;flex-direction:column;gap:14px}
.lab-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.lab-card h2{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.lab-presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.lab-presets button{border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:999px;padding:5px 11px;font:inherit;font-size:.76rem;cursor:pointer}
.lab-presets button:hover{border-color:#FFD600;background:#FFFBE6;color:#101820}
html[data-theme="dark"] .lab-presets button:hover{background:#3a3208;color:#FFD600}

.lab-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lab-fields label{display:flex;flex-direction:column;gap:5px;font-size:.76rem;color:var(--ink-2)}
.lab-fields label > span{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.74rem}
.lab-fields label > span input{flex:1}
.lab-fields input,.lab-fields select{font:inherit;font-size:.9rem;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);color:var(--ink);width:100%}
.lab-fields input:focus,.lab-fields select:focus{outline:2px solid #FFD600;outline-offset:1px}
.lab-fields .wide{grid-column:1/-1}

.lab-verdict{border-radius:14px;padding:14px 16px;border:1px solid var(--line);background:var(--panel)}
.lab-verdict b{display:block;font-size:1.05rem;margin-bottom:4px}
.lab-verdict p{margin:0;font-size:.82rem;color:var(--muted);line-height:1.6}
.lab-verdict.ok{border-color:#1f9d55;background:rgba(31,157,85,.08)}
.lab-verdict.warn{border-color:#d99a00;background:rgba(217,154,0,.1)}
.lab-verdict.bad{border-color:#d34a3a;background:rgba(211,74,58,.08)}
html[data-theme="dark"] .lab-verdict.ok{background:rgba(31,157,85,.14)}
html[data-theme="dark"] .lab-verdict.warn{background:rgba(217,154,0,.14)}
html[data-theme="dark"] .lab-verdict.bad{background:rgba(211,74,58,.14)}

.lab-gauges{display:grid;gap:10px;margin-bottom:4px}
.lab-gauge{display:grid;grid-template-columns:1fr auto;gap:4px 8px;font-size:.78rem}
.lab-gauge .bar{grid-column:1/-1;height:6px;border-radius:99px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line)}
.lab-gauge .bar i{display:block;height:100%;background:#1f9d55;border-radius:99px;transition:width .25s}
.lab-gauge.warn .bar i{background:#d99a00}
.lab-gauge.bad .bar i{background:#d34a3a}

.lab-checks{display:flex;flex-direction:column;gap:2px}
.lab-check{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:.82rem}
.lab-check:last-child{border-bottom:0}
.lab-check .nm{font-weight:650}
.lab-check .vl{font-variant-numeric:tabular-nums;color:var(--ink-2);text-align:right}
.lab-check .nt{grid-column:1/-1;color:var(--muted);font-size:.74rem;line-height:1.5}
.lab-check .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
.lab-check.ok .dot{background:#1f9d55}.lab-check.warn .dot{background:#d99a00}.lab-check.bad .dot{background:#d34a3a}

.lab-ref{max-width:1200px;margin:0 auto 60px;padding:0 24px}
.lab-ref table{width:100%;border-collapse:collapse;font-size:.84rem}
.lab-ref th,.lab-ref td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
.lab-ref th{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.lab-ref td.num{font-variant-numeric:tabular-nums}
.lab-note{color:var(--muted);font-size:.76rem;line-height:1.7;margin-top:10px}
@media(max-width:520px){.lab-fields{grid-template-columns:1fr}}
@media(max-width:760px){.lab-ref{margin-bottom:96px}}

.lab-play{position:absolute;left:12px;top:12px;background:#101820;color:#FFD600;border:0;border-radius:999px;padding:8px 14px;font:inherit;font-size:.8rem;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(8,18,32,.25);z-index:2}
.lab-play.on{background:#FFD600;color:#101820;box-shadow:0 0 0 3px rgba(255,214,0,.35)}
html[data-theme="dark"] .lab-play{background:#FFD600;color:#101820}
html[data-theme="dark"] .lab-play.on{background:#101820;color:#FFD600;box-shadow:0 0 0 2px #FFD600}

</style>

    yaw: 1.35, pitch: 0.24, zoom: 1, auto: true, drag: null,
    p: {}
  };

  var CANVAS = null, CTX = null, MESH = null, RAF = 0, RES = null, LAST = 0;

  /* ---------------- 工具 ---------------- */
  function clamp(v, a, b) { return MATH.max(a, MATH.min(b, v)); }
  function val(id, fb) { var el = document.getElementById(id); if (!el) return fb; var v = parseFloat(el.value); return isNaN(v) ? fb : v; }
  function sel(id, fb) { var el = document.getElementById(id); return el ? el.value : fb; }
  function fmt(v, d) { return Number(v).toLocaleString("zh-CN", { maximumFractionDigits: d == null ? 1 : d }); }

  function defaults(fam) {
    var out = {}, src = FAM[fam].defaults;
    for (var k in src) out[k] = src[k];
    return out;
  }

  function pickMaterial(temp, medium, cat) {
    if (cat === "coupling") {
      if (temp <= 120) return { key: "7075", why: "常温联轴器优先铝合金：惯量小、成本低。" };
      if (temp <= 450) return { key: "316L", why: "温度超过铝合金极限，改不锈钢。" };
      return { key: "625", why: "高温工况需镍基合金。" };
    }
    var corrosive = medium && medium.indexOf("corr") >= 0;
    if (temp > 500) return { key: "625", why: "超过 500°C，普通不锈钢软化氧化，需镍基合金。" };
    if (corrosive && temp > 300) return { key: "625", why: "腐蚀 + 高温，316L 会点蚀。" };
    if (corrosive) return { key: "316L", why: "腐蚀性介质至少 316L；含氯高时建议 Inconel。" };
    if (temp > 400) return { key: "321", why: "高温无腐蚀，321 的钛稳定化抑制晶间腐蚀。" };
    return { key: "304", why: "常规介质与温度，304 足够；有凝露风险升 316L。" };
  }

  function chk(name, v, limit, st, note) { return { name: name, val: v, limit: limit, st: st, note: note }; }
  function worstOf(list) {
    if (list.some(function (c) { return c.st === "bad"; })) return "bad";
    if (list.some(function (c) { return c.st === "warn"; })) return "warn";
    return "ok";
  }

  /* ---------------- 波纹管 ---------------- */
  function calcBellows(p, f) {
    var R = p.od / 2;
    var layers = Math.max(1, p.layers || 1);
    var tTotal = p.wall * layers;
    var Dm = MATH.max(p.od - 2 * tTotal, 1);
    var A = PI / 4 * Dm * Dm;
    var pMPa = p.pressure * 0.1;
    var F = pMPa * A;
    var mat = pickMaterial(p.temp, p.medium, "bellows");
    var E = MAT[mat.key].E, nu = 0.3;
    var h = MATH.max(p.waveH, 0.3);
    var n = MATH.max(p.waves, 1);
    var shape = p.waveShape === "v" ? 1.25 : 1.0;
    var k = 2 * PI * R * (E * MATH.pow(tTotal, 3)) / (12 * (1 - nu * nu) * MATH.pow(h, 3) * n) * f.kf * shape;
    var xp = k > 0 ? F / k : 0;
    var total = p.stroke + xp;
    var ratio = p.len > 0 ? total / p.len : 9;
    var ld = p.od > 0 ? p.len / p.od : 9;
    var pcr = 6 * 2 * E / (1 - nu * nu) * MATH.pow(tTotal / (2 * R), 3) * f.vf; // ×6：波纹几何抗失稳优于等效圆管
    var strain = (tTotal / (2 * R)) * (total / (n * h));
    var life = strain > 0 ? 1e6 * MATH.pow(0.0015 / strain, 3.5) * f.lf : 1e9;

    var checks = [];
    checks.push(chk("行程比 Δx/L₀", fmt(ratio * 100, 1) + "%", "≤ 40%",
      ratio <= 0.4 ? "ok" : ratio <= 0.6 ? "warn" : "bad",
      "超过 40% 刚度非线性上升、寿命骤降；超过 60% 基本不可用。"));
    checks.push(chk("长径比 L₀/D", fmt(ld, 2), p.vacuum ? "≤ 3.0（真空）" : "≤ 4.0",
      ld <= (p.vacuum ? 3 : 4) ? "ok" : ld <= (p.vacuum ? 3.6 : 5) ? "warn" : "bad",
      "外压工况下过长会侧弯失稳，加导杆或缩短单段长度。"));
    checks.push(chk("工作压力 / 工艺上限", fmt(p.pressure, 2) + " / " + fmt(f.pMax, 2) + " bar",
      "≤ " + fmt(f.pMax, 2) + " bar",
      p.pressure <= f.pMax ? "ok" : p.pressure <= f.pMax * 1.2 ? "warn" : "bad",
      f.proc + " 的典型耐压上限约 " + fmt(f.pMax, 2) + " bar；超限需改工艺或加层。"));
    if (p.vacuum) {
      checks.push(chk("外压失稳 p_cr", fmt(pcr, 3) + " MPa", "≥ 0.10 MPa",
        pcr >= 0.1 ? "ok" : pcr >= 0.07 ? "warn" : "bad",
        "真空相当于 0.1 MPa 外压，壁厚不足会吸瘪；p_cr 随壁厚三次方上升。"));
    }
    checks.push(chk("估算寿命", life > 1e8 ? "＞1 亿次" : fmt(life, 0) + " 次", "≥ " + fmt(p.cycles, 0) + " 次",
      life >= p.cycles ? "ok" : life >= p.cycles * 0.5 ? "warn" : "bad",
      "Coffin-Manson 量级估算；" + f.proc + " 的寿命系数已计入。"));
    checks.push(chk("材料耐温", MAT[mat.key].name + " · " + MAT[mat.key].tmax + "°C", "≥ " + p.temp + "°C",
      p.temp <= MAT[mat.key].tmax ? "ok" : "bad", mat.why));
    var need = p.medium.indexOf("corr") >= 0 ? 2 : 1;
    checks.push(chk("介质兼容", MAT[mat.key].name, need === 2 ? "≥ 316L" : "304 起",
      MAT[mat.key].corr >= need ? "ok" : "bad",
      need === 2 ? "腐蚀性介质需 316L 及以上；含氯离子建议 Inconel。" : "无腐蚀介质，304/316L 均可。"));

    return {
      checks: checks, verdict: worstOf(checks),
      material: { name: MAT[mat.key].name, key: mat.key, why: mat.why },
      metrics: { A: A, F: F, k: k, xp: xp, total: total, ratio: ratio, ld: ld, pcr: pcr, life: life },
      gauges: [
        { name: "行程利用率", pct: clamp(ratio / 0.6 * 100, 0, 100), st: ratio <= 0.4 ? "ok" : ratio <= 0.6 ? "warn" : "bad", txt: fmt(ratio * 100, 0) + "%" },
        { name: "压力利用率", pct: clamp(p.pressure / (f.pMax * 1.2) * 100, 0, 100), st: p.pressure <= f.pMax ? "ok" : "bad", txt: fmt(p.pressure / f.pMax * 100, 0) + "%" },
        { name: "寿命裕度", pct: clamp(life / p.cycles / 2 * 100, 0, 100), st: life >= p.cycles ? "ok" : "bad", txt: life >= 1e8 ? "＞1e8" : fmt(life, 0) }
      ]
    };
  }

  /* ---------------- 弹簧 ---------------- */
  function calcSpecial(p, f) {
    var mat = f.cat === "hardware" ? { key: "304", why: "紧固件与垫圈常用不锈钢或碳钢，按 304 估算。" } : pickMaterial(p.temp || 25, "", "spring");
    var checks = [], metrics = {}, gauges = [];
    if (f.proc === "拉伸弹簧") {
      var d = p.wire, D = p.meanD, C = D / d, n = p.coils;
      var Kw = (4 * C - 1) / (4 * C - 4) + 0.615 / C;
      var k = 79000 * Math.pow(d, 4) / (8 * Math.pow(D, 3) * n);
      var tau = 8 * p.load * D / (Math.PI * Math.pow(d, 3)) * Kw;
      var allow = 0.42 * 1800;
      metrics = { k: k, tau: tau, C: C };
      checks.push(chk("旋绕比 C", fmt(C, 2), "4 – 12", C >= 4 && C <= 12 ? "ok" : "warn", "太小难卷制，太大易颤。"));
      checks.push(chk("簧身应力 τ", fmt(tau, 0) + " MPa", "≤ " + fmt(allow, 0), tau <= allow ? "ok" : "bad", "含 Wahl 修正；钩部还要再折减。"));
      checks.push(chk("钩部应力", fmt(tau * 1.3, 0) + " MPa", "≤ " + fmt(allow, 0), tau * 1.3 <= allow ? "ok" : "warn", "钩根是应力集中点，按 1.3 倍估算。"));
      gauges = [{ name: "应力利用率", pct: clamp(tau * 1.3 / allow * 100, 0, 100), st: tau * 1.3 <= allow ? "ok" : "bad", txt: fmt(tau * 1.3 / allow * 100, 0) + "%" }];
    } else if (f.proc === "扭转弹簧") {
      var d2 = p.wire, D2 = p.meanD, n2 = p.coils;
      var kt = 206000 * Math.pow(d2, 4) / (3667 * D2 * n2);
      var T = p.load;
      var tau2 = 32 * T / (Math.PI * Math.pow(d2, 3));
      var allow2 = 0.6 * 1200;
      metrics = { k: kt, tau: tau2 };
      checks.push(chk("扭矩刚度", fmt(kt, 2) + " N·mm/°", "—", "ok", "k = E·d⁴/(3667·D·n)，E 取 206 GPa。"));
      checks.push(chk("弯曲应力 σ", fmt(tau2, 0) + " MPa", "≤ " + fmt(allow2, 0), tau2 <= allow2 ? "ok" : "bad", "扭转弹簧按弯曲应力校核，不是剪切。"));
      checks.push(chk("角度 / 圈数", fmt((p.angle || 0) / 360, 2) + " 圈", "≤ " + fmt(p.coils * 0.8, 1) + " 圈", (p.angle || 0) / 360 <= p.coils * 0.8 ? "ok" : "warn", "转角过大会使内径收缩、与轴干涉。"));
      gauges = [{ name: "应力利用率", pct: clamp(tau2 / allow2 * 100, 0, 100), st: tau2 <= allow2 ? "ok" : "bad", txt: fmt(tau2 / allow2 * 100, 0) + "%" }];
    } else if (f.proc === "碟形弹簧") {
      var E = 206000, nu = 0.3, Do = p.od, h0 = Math.max(p.meanD, 0.05), t = Math.max(p.wire, 0.05);
      var kd = 4 * E * Math.pow(t, 3) / (3 * (1 - nu * nu) * Do * Do);
      var Fmax = kd * h0;
      var sig = 4 * E * t * h0 / ((1 - nu * nu) * Do * Do);
      metrics = { k: kd, F: Fmax, tau: sig };
      checks.push(chk("压平载荷（估算）", fmt(Fmax, 0) + " N", "—", "ok", "按 DIN 2093 简化式，用于判断量级。"));
      checks.push(chk("压平应力", fmt(sig, 0) + " MPa", "≤ 1200 MPa", sig <= 1200 ? "ok" : "warn", "超过材料屈服后碟簧会塌陷、力值衰减。"));
      checks.push(chk("h₀/t 比", fmt(h0 / t, 2), "0.6 – 1.4", h0 / t >= 0.6 && h0 / t <= 1.4 ? "ok" : "warn", "比值决定刚度曲线形状；过大易失稳翻转。"));
      gauges = [{ name: "应力利用率", pct: clamp(sig / 1200 * 100, 0, 100), st: sig <= 1200 ? "ok" : "bad", txt: fmt(sig / 1200 * 100, 0) + "%" }];
    } else if (f.proc === "恒力弹簧") {
      var b = p.od || 12, tt = p.wire || 0.2, R0 = 15;
      var F = 206000 * b * Math.pow(tt, 3) / (12 * R0 * R0);
      metrics = { F: F };
      checks.push(chk("展开力（量级）", fmt(F, 2) + " N", "≈ " + fmt(p.load, 1) + " N", Math.abs(F - p.load) / Math.max(p.load, 1) < 0.3 ? "ok" : "warn", "恒力弹簧力值主要由带厚三次方决定。"));
      checks.push(chk("带厚 / 带宽", fmt(tt, 2) + " / " + fmt(b, 1) + " mm", "—", "ok", "带太薄易屈曲，太厚卷不动。"));
      gauges = [{ name: "力值匹配", pct: clamp(p.load / Math.max(F, 0.01) * 100, 0, 100), st: Math.abs(F - p.load) / Math.max(p.load, 1) < 0.3 ? "ok" : "warn", txt: fmt(F, 1) + " N" }];
    } else if (f.proc === "螺栓 / 螺钉") {
      var A = Math.PI * p.dia * p.dia / 4;
      var grades = { "4.6": 400, "8.8": 800, "10.9": 1040, "12.9": 1220 };
      var sut = grades[String(p.grade)] || 800;
      var Fallow = A * sut * 0.6;
      metrics = { A: A, F: Fallow };
      checks.push(chk("拉伸承载力", fmt(Fallow, 0) + " N", "≥ " + fmt(p.load, 0) + " N", Fallow >= p.load ? "ok" : "bad", "按 0.6σ_uts 计，未考虑螺纹剪切与疲劳。"));
      checks.push(chk("应力截面积", fmt(A, 1) + " mm²", "—", "ok", "A = πd²/4，实际按公称应力截面积略小。"));
      gauges = [{ name: "载荷利用率", pct: clamp(p.load / Fallow * 100, 0, 100), st: p.load <= Fallow ? "ok" : "bad", txt: fmt(p.load / Fallow * 100, 0) + "%" }];
    } else {
      var Ao = Math.PI * (p.od * p.od - p.bore * p.bore) / 4;
      var pres = p.load / Ao;
      metrics = { A: Ao, p: pres };
      checks.push(chk("承压面积", fmt(Ao, 1) + " mm²", "—", "ok", "A = π(OD²−ID²)/4。"));
      checks.push(chk("承压应力", fmt(pres, 2) + " MPa", "≤ 300 MPa", pres <= 300 ? "ok" : "warn", "软材料垫圈会压溃；硬垫圈按材料屈服校核。"));
      gauges = [{ name: "承压利用率", pct: clamp(pres / 300 * 100, 0, 100), st: pres <= 300 ? "ok" : "warn", txt: fmt(pres, 1) + " MPa" }];
    }
    return { checks: checks, verdict: worstOf(checks), material: { name: MAT[mat.key].name, key: mat.key, why: mat.why }, metrics: metrics, gauges: gauges };
  }

  function calcSpring(p, f) {
    if (["拉伸弹簧", "扭转弹簧", "碟形弹簧", "恒力弹簧"].indexOf(f.proc) >= 0) return calcSpecial(p, f);
    var mat = pickMaterial(p.temp, "", "spring");
    var checks = [], metrics = {}, gauges = [];
    if (f.proc === "机加工弹簧") {
      var Ro = p.od / 2, Ri = p.bore / 2, Rm = (Ro + Ri) / 2;
      var J = PI / 32 * (MATH.pow(p.od, 4) - MATH.pow(p.bore, 4));
      var G = MAT[mat.key].G;
      var k = G * J / (MATH.max(p.len, 1) * Rm * Rm);
      var T = p.load * Rm;
      var tau = T * Ro / J;
      metrics = { k: k, tau: tau };
      checks.push(chk("刚度 k", fmt(k, 2) + " N/mm", "—", "ok", "机加工弹簧：k = G·J/(L·R²)，整体切槽无绕制应力。"));
      checks.push(chk("剪切应力 τ", fmt(tau, 0) + " MPa", "≤ " + fmt(f.allow * 900, 0) + " MPa",
        tau <= f.allow * 900 ? "ok" : tau <= f.allow * 1100 ? "warn" : "bad", "机加工件按 0.35σ 取值更保守。"));
      checks.push(chk("壁厚 (OD−bore)/2", fmt((p.od - p.bore) / 2, 2) + " mm", "≥ 2 mm",
        (p.od - p.bore) / 2 >= 2 ? "ok" : "warn", "壁太薄切槽后刚度不足、易变形。"));
      checks.push(chk("材料耐温", MAT[mat.key].name, "≥ " + p.temp + "°C", p.temp <= MAT[mat.key].tmax ? "ok" : "bad", mat.why));
      gauges = [
        { name: "应力利用率", pct: clamp(tau / 350 * 100, 0, 100), st: tau <= 350 ? "ok" : "bad", txt: fmt(tau / 350 * 100, 0) + "%" },
        { name: "壁厚", pct: clamp((p.od - p.bore) / 2 / 5 * 100, 0, 100), st: (p.od - p.bore) / 2 >= 2 ? "ok" : "warn", txt: fmt((p.od - p.bore) / 2, 1) + " mm" }
      ];
      return { checks: checks, verdict: worstOf(checks), material: { name: MAT[mat.key].name, key: mat.key, why: mat.why }, metrics: metrics, gauges: gauges };
    }

    var d = MATH.max(p.wire, 0.1), D = MATH.max(p.meanD, d * 1.5), n = MATH.max(p.coils, 1);
    var C = D / d;
    var Kw = (4 * C - 1) / (4 * C - 4) + 0.615 / C;
    var G2 = 79000;
    var k2 = G2 * MATH.pow(d, 4) / (8 * MATH.pow(D, 3) * n);
    var tau2 = 8 * p.load * D / (PI * MATH.pow(d, 3)) * Kw;
    var allow = f.allow * (p.shot === "yes" ? 1.15 : 1) * 1800;
    var ld = p.len / D;
    metrics = { k: k2, tau: tau2, C: C };
    checks.push(chk("旋绕比 C = D/d", fmt(C, 2), "4 – 12", C >= 4 && C <= 12 ? "ok" : C >= 3.5 && C <= 14 ? "warn" : "bad",
      "C 太小难卷制、应力集中；太大易颤、尺寸失控。"));
    checks.push(chk("剪切应力 τ", fmt(tau2, 0) + " MPa", "≤ " + fmt(allow, 0) + " MPa",
      tau2 <= allow ? "ok" : tau2 <= allow * 1.15 ? "warn" : "bad",
      "含 Wahl 修正；喷丸可提高约 15% 疲劳许用。" + (p.shot === "yes" ? "（已计入喷丸）" : "")));
    checks.push(chk("长径比 L₀/D", fmt(ld, 2), "≤ 2.6", ld <= 2.6 ? "ok" : ld <= 3.2 ? "warn" : "bad",
      "超过 2.6 需导杆或导向套，否则压缩时侧弯。"));
    checks.push(chk("端部形式", p.endType === "ground" ? "磨平端" : p.endType === "closed" ? "并紧端" : "开口端", "—", "ok",
      "磨平端垂直度最好；并紧端成本低；开口端少用。"));
    checks.push(chk("材料耐温", MAT[mat.key].name, "≥ " + p.temp + "°C", p.temp <= MAT[mat.key].tmax ? "ok" : "bad", mat.why));
    return {
      checks: checks, verdict: worstOf(checks), material: { name: MAT[mat.key].name, key: mat.key, why: mat.why }, metrics: metrics,
      gauges: [
        { name: "应力利用率", pct: clamp(tau2 / allow * 100, 0, 100), st: tau2 <= allow ? "ok" : "bad", txt: fmt(tau2 / allow * 100, 0) + "%" },
        { name: "长径比", pct: clamp(ld / 3.2 * 100, 0, 100), st: ld <= 2.6 ? "ok" : "warn", txt: fmt(ld, 2) }
      ]
    };
  }

  /* ---------------- 联轴器 ---------------- */
  function calcCoupling(p, f) {
    var Ro = p.od / 2;
    var mat = pickMaterial(80, "", "coupling");
    var J = PI / 32 * (MATH.pow(p.od, 4) - MATH.pow(p.bore, 4));
    var tauAllow = mat.key === "7075" ? 150 : 120;
    var Tcap = f.tFactor * tauAllow * J / Ro / 1000;
    var checks = [];
    checks.push(chk("额定扭矩（估算）", fmt(Tcap, 1) + " N·m", "≥ " + fmt(p.torque, 1) + " N·m",
      Tcap >= p.torque ? "ok" : Tcap >= p.torque * 0.8 ? "warn" : "bad",
      "按 " + f.proc + " 的经验折算（系数 " + f.tFactor + "），未计冲击载荷。"));
    checks.push(chk("径向偏差", fmt(p.misalign, 2) + " mm", "≤ " + fmt(f.misMax, 2) + " mm",
      p.misalign <= f.misMax ? "ok" : p.misalign <= f.misMax * 1.6 ? "warn" : "bad",
      "超差会让轴承承受附加载荷，并降低寿命。"));
    if (f.angleMax) {
      checks.push(chk("工作角度", fmt(p.angle || 0, 1) + "°", "≤ " + f.angleMax + "°",
        (p.angle || 0) <= f.angleMax ? "ok" : "bad", "万向节角度越大，速度波动越大，建议成对使用。"));
    }
    checks.push(chk("转速", fmt(p.rpm, 0) + " rpm", "≤ " + fmt(f.rpmMax, 0) + " rpm",
      p.rpm <= f.rpmMax ? "ok" : p.rpm <= f.rpmMax * 1.2 ? "warn" : "bad", "高速需校核临界转速与动平衡。"));
    checks.push(chk("轮毂形式", p.hub === "clamp" ? "夹紧式" : p.hub === "setscrew" ? "顶丝式" : "键槽式", "—", "ok",
      p.hub === "clamp" ? "夹紧式不伤轴、动平衡好。" : p.hub === "setscrew" ? "顶丝式便宜，但会压伤轴、动平衡差。" : "键槽式传扭大，但有背隙。"));
    return {
      checks: checks, verdict: worstOf(checks), material: { name: MAT[mat.key].name, key: mat.key, why: mat.why },
      metrics: { Tcap: Tcap, J: J },
      gauges: [
        { name: "扭矩利用率", pct: clamp(p.torque / Tcap * 100, 0, 100), st: p.torque <= Tcap ? "ok" : "bad", txt: fmt(p.torque / Tcap * 100, 0) + "%" },
        { name: "转速利用率", pct: clamp(p.rpm / (f.rpmMax * 1.2) * 100, 0, 100), st: p.rpm <= f.rpmMax ? "ok" : "bad", txt: fmt(p.rpm / f.rpmMax * 100, 0) + "%" }
      ]
    };
  }

  /* ---------------- 网格 ---------------- */
function radialRing(verts, r, z, segs) {
    var base = verts.length;
    for (var j = 0; j < segs; j++) {
      var a = j / segs * 2 * PI;
      verts.push([MATH.cos(a) * r, MATH.sin(a) * r, z]);
    }
    return base;
  }

  function ringFaces(faces, a, b, segs, col, skip) {
    for (var j = 0; j < segs; j++) {
      if (skip && skip(j)) continue;
      var j2 = (j + 1) % segs;
      faces.push({ v: [a + j, a + j2, b + j2, b + j], c: col });
    }
  }

  /* 波纹管：圆角波 + 法兰（带螺栓孔）+ 通孔 */
  function meshBellows(p, f) {

  function draw() {

    var maxR = 1;
    MESH.verts.forEach(function (v) { maxR = MATH.max(maxR, MATH.abs(v[0]), MATH.abs(v[1]), MATH.abs(v[2]) / 1.3); });
    var scale = MATH.min(W, H) * (FAM[state.fam].cat === "cad" ? 0.34 : 0.22) / maxR;

    var view = MESH.verts.map(function (v) { return rot([v[0], v[1], v[2] * squash]); });
    var proj = view.map(function (v) {

    });

    light = light.map(function (x) { return x / ln; });

    var hl = MATH.sqrt(half[0] * half[0] + half[1] * half[1] + half[2] * half[2]);
    half = half.map(function (x) { return x / hl; });

    var faces = [];
    MESH.faces.forEach(function (f) {
      var a = view[f.v[0]], b = view[f.v[1]], c = view[f.v[2]];
      var u = [b[0] - a[0], b[1] - a[1], b[2] - a[2]];
      var w = [c[0] - a[0], c[1] - a[1], c[2] - a[2]];
      var n = [u[1] * w[2] - u[2] * w[1], u[2] * w[0] - u[0] * w[2], u[0] * w[1] - u[1] * w[0]];
      var nl = MATH.sqrt(n[0] * n[0] + n[1] * n[1] + n[2] * n[2]) || 1;
      n = [n[0] / nl, n[1] / nl, n[2] / nl];
      var back = n[2] < -0.02;
      if (back) n = [-n[0], -n[1], -n[2]];
      var diff = MATH.max(0, n[0] * light[0] + n[1] * light[1] + n[2] * light[2]);
      var spec = MATH.pow(MATH.max(0, n[0] * half[0] + n[1] * half[1] + n[2] * half[2]), 22) * 0.55;
      var shade = 0.34 + 0.66 * diff;
      var depth = (a[2] + b[2] + c[2]) / 3;
      faces.push({ p: f.v.map(function (i) { return proj[i]; }), col: f.c, shade: shade, spec: spec, depth: depth });
    });
    faces.sort(function (a, b) { return a.depth - b.depth; });

    faces.forEach(function (f) {
      var r = clamp(f.col[0] * f.shade + 255 * f.spec, 0, 255);
      var gg = clamp(f.col[1] * f.shade + 255 * f.spec, 0, 255);
      var bb = clamp(f.col[2] * f.shade + 255 * f.spec, 0, 255);
      var col = "rgb(" + Math.round(r) + "," + Math.round(gg) + "," + Math.round(bb) + ")";
      CTX.beginPath();
      CTX.moveTo(f.p[0][0], f.p[0][1]);
      for (var i = 1; i < f.p.length; i++) CTX.lineTo(f.p[i][0], f.p[i][1]);
      CTX.closePath();
      CTX.fillStyle = col;
      CTX.fill();
      CTX.strokeStyle = col;
      CTX.lineWidth = 0.7;
      CTX.stroke();
    });

    if (MESH.lines) {
      CTX.lineCap = "round";
      CTX.lineWidth = Math.max(2.5, scale * 0.42);
      CTX.strokeStyle = "rgba(42,50,62,.92)";
      MESH.lines.forEach(function (pts) {
        var pen = false;
        CTX.beginPath();
        for (var li = 0; li < pts.length; li++) {
          var p0 = pts[li];
          var nv = rot([p0[0], p0[1], 0]);
          if (nv[2] < 0.05) { pen = false; continue; }
          var pv = rot([p0[0], p0[1], p0[2] * squash]);
          var pf = clamp(camD / (camD - pv[2]), 0.62, 1.55);
          var px = cx + pv[0] * scale * pf * state.zoom, py = cy - pv[1] * scale * pf * state.zoom;
          if (!pen) { CTX.moveTo(px, py); pen = true; } else { CTX.lineTo(px, py); }
        }
        CTX.stroke();
      });
    }
  }

    if (state.auto || state.anim || state.dirty) { if (!LAST || ts - LAST > 33) { draw(); LAST = ts; state.dirty = false; } }
    RAF = requestAnimationFrame(loop);
  }
