<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>MW 销售工程师训练营 · 60 天</title>
<style>
/* ============================================================
   MW 閿€鍞伐绋嬪笀璁粌钀?路 绔欑偣鏍峰紡
   绉诲姩浼樺厛锛屾棤澶栭儴渚濊禆锛宖ile:// 鐩存帴鍙敤
   ============================================================ */

:root{
  --bg:#f5f8fc; --panel:#ffffff; --panel-2:#fbfcfe;
  --ink:#0e1726; --ink-2:#33445c; --muted:#5f7189;
  --line:#e2e9f3; --line-2:#cfdae9;
  --brand:#0f766e; --brand-2:#14b8a6; --brand-soft:#e6f6f3;
  --accent:#b45309; --accent-soft:#fdf3e3;
  --blue:#1d4ed8; --blue-soft:#eaf0ff;
  --danger:#b91c1c;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px -12px rgba(15,23,42,.15);
  --shadow-lg:0 20px 50px -24px rgba(15,23,42,.28);
  --r:16px; --r-sm:10px;
  --max:1120px;
  --font:"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Code",Consolas,"SF Mono",monospace;
}
html[data-theme="dark"]{
  --bg:#080f19; --panel:#0f1a29; --panel-2:#0c1522;
  --ink:#e8eff9; --ink-2:#c2d0e2; --muted:#8fa1b8;
  --line:#1b2a3e; --line-2:#26374e;
  --brand:#2dd4bf; --brand-2:#5eead4; --brand-soft:#0d2b2a;
  --accent:#fbbf24; --accent-soft:#2a2110;
  --blue:#7aa2ff; --blue-soft:#141f38;
  --danger:#f87171;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -16px rgba(0,0,0,.6);
  --shadow-lg:0 24px 60px -28px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:16px;line-height:1.75;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.55;
  background:
    radial-gradient(760px 420px at 8% -8%, rgba(20,184,166,.12), transparent 62%),
    radial-gradient(700px 420px at 100% 0%, rgba(37,99,235,.09), transparent 58%);
}
img,svg{max-width:100%;display:block}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit}
b,strong{font-weight:650}
code{font-family:var(--mono);font-size:.88em;background:var(--panel-2);border:1px solid var(--line);padding:1px 6px;border-radius:6px;color:var(--brand)}
sub,sup{font-size:.7em}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}

/* ---------- 椤堕儴杩涘害鏉?---------- */
.scroll-progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:90;background:transparent}
.scroll-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--brand-2));transition:width .12s linear}

/* ---------- 澶撮儴 ---------- */
.hdr{
  position:sticky;top:0;z-index:70;
  background:var(--bg);
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:saturate(1.4) blur(14px);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line);
}
.hdr-in{
  max-width:var(--max);margin:0 auto;padding:10px clamp(14px,3vw,24px);
  display:flex;align-items:center;gap:16px;
}
.brand{display:flex;align-items:center;gap:10px;color:inherit;min-width:0}
.brand:hover{text-decoration:none}
.brand-mark{
  width:38px;height:38px;flex:0 0 38px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--brand),var(--brand-2));color:#04231f;
  font-weight:800;font-size:13px;letter-spacing:.4px;box-shadow:var(--shadow);
}
.brand-txt{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.brand-txt b{font-size:14.5px;letter-spacing:.2px;white-space:nowrap}
.brand-txt i{font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{
  padding:7px 13px;border-radius:9px;color:var(--ink-2);font-size:13.5px;font-weight:500;
  transition:background .16s,color .16s;white-space:nowrap;
}
.nav a:hover{background:var(--panel);color:var(--ink);text-decoration:none}
.nav a.on{background:var(--brand-soft);color:var(--brand);font-weight:650}
.hdr-right{display:flex;align-items:center;gap:8px}
.hdr-progress{
  font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);
  border:1px solid var(--line);background:var(--panel);padding:4px 10px;border-radius:99px;white-space:nowrap;
}
.icon-btn{
  width:38px;height:38px;display:grid;place-items:center;border-radius:10px;cursor:pointer;
  background:var(--panel);border:1px solid var(--line);color:var(--ink-2);transition:.16s;
}
.icon-btn:hover{border-color:var(--line-2);color:var(--ink);transform:translateY(-1px)}

/* ---------- 甯冨眬 ---------- */
.app{max-width:var(--max);margin:0 auto;padding:clamp(18px,3vw,32px) clamp(14px,3vw,24px) 120px;min-height:60vh}
.foot{border-top:1px solid var(--line);background:var(--panel-2)}
.foot-in{max-width:var(--max);margin:0 auto;padding:22px clamp(14px,3vw,24px) 90px;color:var(--muted);font-size:12.5px}
.foot p{margin:0 0 4px}
.foot .fine{font-size:11.5px;opacity:.85}

/* ---------- 棣栭〉 ---------- */
.hero{
  position:relative;overflow:hidden;border-radius:22px;padding:clamp(24px,4.4vw,44px);
  background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 12%,var(--panel)),var(--panel) 62%);
  border:1px solid var(--line);box-shadow:var(--shadow);
}
.hero::after{
  content:"";position:absolute;right:-90px;top:-110px;width:320px;height:320px;border-radius:50%;
  background:radial-gradient(circle,rgba(20,184,166,.22),transparent 68%);pointer-events:none;
}
.eyebrow{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--brand);font-weight:700;margin:0 0 10px}
.hero h1{
  margin:0 0 12px;font-size:clamp(24px,4.6vw,40px);line-height:1.24;letter-spacing:-.2px;font-weight:750;
}
.hero h1 em{font-style:normal;color:var(--brand)}
.hero p{margin:0;color:var(--ink-2);font-size:clamp(14px,1.6vw,16px);max-width:58ch}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.btn{
  display:inline-flex;align-items:center;gap:8px;border-radius:11px;padding:11px 18px;
  font-size:14px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:.16s;
  text-decoration:none;line-height:1.2;min-height:44px;
}
.btn:hover{text-decoration:none;transform:translateY(-1px)}
.btn-primary{background:linear-gradient(180deg,var(--brand-2),var(--brand));color:#04231f;box-shadow:0 8px 20px -12px rgba(15,118,110,.8)}
.btn-ghost{background:var(--panel);border-color:var(--line-2);color:var(--ink)}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn-sm{padding:7px 12px;font-size:12.5px;min-height:34px;border-radius:9px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:clamp(20px,2.6vw,26px);line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted);letter-spacing:.3px}

.section{margin-top:34px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.section-h h2{margin:0;font-size:clamp(17px,2.2vw,20px);letter-spacing:.2px}
.section-h .more{font-size:12.5px;color:var(--muted)}

/* 浠婃棩鍗＄墖 */
.today{
  display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;
  border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3vw,26px);
  background:linear-gradient(120deg,var(--panel),var(--panel-2));box-shadow:var(--shadow);
  position:relative;overflow:hidden;
}
.today::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--brand-2),var(--brand))}
.today-tag{
  display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.6px;
  color:var(--brand);background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand) 25%,transparent);
  padding:3px 10px;border-radius:99px;margin-bottom:10px;
}
.today h3{margin:0 0 6px;font-size:clamp(17px,2.4vw,21px);line-height:1.35}
.today p{margin:0;color:var(--muted);font-size:13.5px}
.today-meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
.today-meta span{display:inline-flex;align-items:center;gap:5px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--brand);display:inline-block}

/* 鍛ㄥ垪琛?*/
.weeks{display:grid;gap:12px}
.week{border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden;box-shadow:var(--shadow)}
.week-h{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.week-n{
  flex:0 0 auto;font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--brand);
  background:var(--brand-soft);border-radius:8px;padding:4px 9px;
}
.week-h h3{margin:0;font-size:14.5px;flex:1;min-width:0}
.week-h .cnt{font-size:11.5px;color:var(--muted);white-space:nowrap}
.lessons{list-style:none;margin:0;padding:6px}
.lesson-row{
  display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:11px;
  color:var(--ink-2);transition:background .14s;text-decoration:none;
}
a.lesson-row:hover{background:var(--panel-2);text-decoration:none}
.lesson-row .idx{
  flex:0 0 30px;height:30px;border-radius:9px;display:grid;place-items:center;
  font-size:11.5px;font-weight:700;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.lesson-row .t{flex:1;min-width:0;font-size:13.5px;line-height:1.45}
.lesson-row .t small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.lesson-row .st{font-size:11px;color:var(--muted);white-space:nowrap}
.lesson-row.done .idx{background:var(--brand);border-color:var(--brand);color:#04231f}
.lesson-row.done .st{color:var(--brand);font-weight:600}
.lesson-row.today{background:var(--brand-soft)}
.lesson-row.today .idx{background:linear-gradient(180deg,var(--brand-2),var(--brand));color:#04231f;border-color:transparent}
.lesson-row.locked{opacity:.62;cursor:not-allowed}
.lesson-row.locked .st{color:var(--muted)}

/* ---------- 璇剧▼椤?---------- */
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.crumb a{color:var(--muted)}
.crumb a:hover{color:var(--brand)}

.lesson-wrap{display:grid;gap:28px;max-width:1040px;margin:0 auto}
@media(min-width:1000px){
  .lesson-wrap{grid-template-columns:236px minmax(0,1fr);align-items:start}
}
.toc{
  border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:14px;
  box-shadow:var(--shadow);font-size:12.8px;
}
@media(min-width:1000px){.toc{position:sticky;top:80px}}
.toc h4{margin:0 0 8px;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.toc ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.toc a{display:block;padding:6px 8px;border-radius:8px;color:var(--ink-2);line-height:1.45}
.toc a:hover{background:var(--panel-2);text-decoration:none;color:var(--brand)}
.toc .toc-prog{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);color:var(--muted);font-size:11.5px}

.article{max-width:760px;min-width:0}
.art-head{border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:24px}
.art-kicker{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:11.5px;color:var(--muted);margin-bottom:10px}
.chip{
  font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;
  background:var(--panel-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap;
}
.chip.brand{background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand) 25%,transparent);color:var(--brand)}
.chip.warm{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 25%,transparent);color:var(--accent)}
.art-head h1{margin:0 0 10px;font-size:clamp(23px,4vw,34px);line-height:1.28;letter-spacing:-.2px;font-weight:750}
.art-head .sub{margin:0;color:var(--ink-2);font-size:15px}

.objectives{
  border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:12px;
  background:var(--panel);padding:14px 16px;margin:0 0 26px;
}
.objectives h4{margin:0 0 8px;font-size:12px;letter-spacing:1px;color:var(--brand);text-transform:uppercase}
.objectives ol{margin:0;padding-left:20px;color:var(--ink-2);font-size:13.8px}
.objectives li{margin:5px 0}

.article h2{
  margin:40px 0 12px;font-size:clamp(18px,2.6vw,22px);line-height:1.4;letter-spacing:.1px;
  scroll-margin-top:84px;font-weight:700;
}
.article h3{margin:26px 0 8px;font-size:16.5px;scroll-margin-top:84px}
.article p{margin:0 0 14px;color:var(--ink-2);font-size:15.5px}
.article p.lead{font-size:16.5px;color:var(--ink)}
.article ul,.article ol{margin:0 0 16px;padding-left:22px;color:var(--ink-2);font-size:15.5px}
.article li{margin:7px 0}
.article li::marker{color:var(--brand)}

.callout{border:1px solid var(--line);border-radius:14px;padding:15px 17px;margin:20px 0;background:var(--panel)}
.callout .co-t{font-size:11.5px;font-weight:750;letter-spacing:.8px;margin-bottom:6px}
.callout p{margin:0;font-size:14.6px}
.callout.key{border-left:3px solid var(--brand);background:linear-gradient(180deg,var(--brand-soft),var(--panel) 70%)}
.callout.key .co-t{color:var(--brand)}
.callout.warn{border-left:3px solid var(--accent);background:linear-gradient(180deg,var(--accent-soft),var(--panel) 70%)}
.callout.warn .co-t{color:var(--accent)}
.callout.note{border-left:3px solid var(--blue);background:linear-gradient(180deg,var(--blue-soft),var(--panel) 70%)}
.callout.note .co-t{color:var(--blue)}

.quote{margin:20px 0;padding:14px 18px;border-left:3px solid var(--line-2);color:var(--muted);font-size:14.5px}

/* 琛ㄦ牸 */
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:13px;margin:18px 0 10px;background:var(--panel)}
.tbl table{border-collapse:collapse;width:100%;min-width:560px;font-size:13.4px}
.tbl th{background:var(--panel-2);text-align:left;font-weight:650;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12.3px;color:var(--ink)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--panel-2)}
.tbl .dim{color:var(--muted);font-size:11.5px}
.fine{font-size:11.8px;color:var(--muted);line-height:1.65;margin:6px 0 0}

/* 鍗＄墖缁?*/
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px;margin:18px 0}
.card{border:1px solid var(--line);border-radius:13px;padding:14px;background:var(--panel);transition:.16s}
.card:hover{border-color:var(--line-2);transform:translateY(-2px);box-shadow:var(--shadow)}
.card h4{margin:0 0 6px;font-size:14px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card p{margin:0;font-size:12.9px;color:var(--muted);line-height:1.62}

/* 姝ラ */
.steps{list-style:none;padding:0;margin:18px 0;counter-reset:s}
.steps li{position:relative;padding:0 0 0 40px;margin:0 0 14px;counter-increment:s;color:var(--ink-2);font-size:15px}
.steps li::before{
  content:counter(s);position:absolute;left:0;top:1px;width:26px;height:26px;border-radius:9px;
  display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--brand);
  background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand) 22%,transparent);
}
.steps li b{display:block;color:var(--ink);margin-bottom:2px}

/* 閿€?*/
.kv{border:1px solid var(--line);border-radius:13px;overflow:hidden;margin:16px 0;background:var(--panel)}
.kv-row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.kv-row:last-child{border-bottom:0}
.kv-k{font-size:12.3px;font-weight:650;color:var(--brand)}
.kv-v{font-size:13.6px;color:var(--ink-2)}

/* 鎶樺彔 */
details.acc{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin:9px 0;overflow:hidden}
details.acc summary{
  cursor:pointer;padding:12px 15px;font-size:13.8px;font-weight:600;color:var(--ink);
  list-style:none;display:flex;align-items:center;gap:9px;
}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::before{content:"";width:6px;height:6px;border-right:2px solid var(--brand);border-bottom:2px solid var(--brand);transform:rotate(-45deg);transition:.2s;flex:0 0 auto}
details.acc[open] summary::before{transform:rotate(45deg)}
details.acc summary:hover{background:var(--panel-2)}
.acc-b{padding:0 15px 14px;color:var(--ink-2);font-size:14px;border-top:1px solid var(--line);padding-top:12px}

/* 娴嬮獙 */
.quiz{display:grid;gap:9px;margin:16px 0}
details.q{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
details.q summary{cursor:pointer;padding:12px 15px;font-size:14px;list-style:none;display:flex;gap:10px;color:var(--ink)}
details.q summary::-webkit-details-marker{display:none}
details.q summary:hover{background:var(--panel-2)}
details.q .qn{color:var(--brand);font-weight:800;font-size:11.5px;flex:0 0 auto;padding-top:3px}
details.q .ans{padding:0 15px 14px;border-top:1px solid var(--line);padding-top:11px;font-size:13.8px;color:var(--ink-2)}
details.q .ans::before{content:"鍙傝€冪瓟妗?;display:block;font-size:10.5px;letter-spacing:1px;color:var(--accent);font-weight:700;margin-bottom:4px}

/* 鍥?*/
figure.fig{margin:22px 0;border:1px solid var(--line);border-radius:15px;background:var(--panel);padding:14px;overflow:hidden}
figure.fig svg{width:100%;height:auto;display:block}
figure.fig figcaption{font-size:12px;color:var(--muted);margin-top:8px;text-align:center}
.fig-t{font-size:12.5px;font-weight:650;color:var(--ink);margin-bottom:8px;display:flex;gap:8px;align-items:center}
.fig-t span{font-weight:400;color:var(--muted);font-size:11.5px}

/* 宸ュ叿/璁＄畻鍣?*/
.widget{border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,var(--panel),var(--panel-2));padding:16px;margin:22px 0;box-shadow:var(--shadow)}
.widget-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px;flex-wrap:wrap}
.widget-h h4{margin:0;font-size:14px}
.widget-h .chip{font-size:10.5px}
.widget .hint{font-size:12px;color:var(--muted);margin:0 0 14px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.wfield{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted)}
.wfield input,.wfield select{
  width:100%;font-size:16px;font-family:inherit;padding:9px 10px;border-radius:9px;
  border:1px solid var(--line-2);background:var(--panel);color:var(--ink);min-height:42px;
}
.wfield input:focus,.wfield select:focus{outline:2px solid color-mix(in srgb,var(--brand) 45%,transparent);outline-offset:1px;border-color:var(--brand)}

        { t: "callout", kind: "note", title: "下周预告", x: "第 6 课开始进入弹簧——同样是“弹性元件”，但它的语言体系完全不同：刚度、应力、并圈、失稳。你会发现，波纹管那套“三角取舍”的思路可以平移。" },

        { t: "callout", kind: "warn", title: "周末作业（30 分钟）", x: "① 把三分钟串讲稿录成音频，自己听一遍，去掉“嗯、那个”；② 找一位同事，用 5 分钟给他讲三种工艺，让他提问；③ 把回答不上的问题记下来，下周带来。" }
      ],
      exam: {
        pass: 80,
        minutes: 15,
        intro: "第一周综合卷，覆盖全部知识点。80 分及格——达不到就回去重读对应小节。",
        questions: [
          { q: "下列品牌与工艺的对应，正确的是？", opts: ["BellowsTech = 电铸", "Servometer = 液压成型", "Ameriflex = 液压成型", "Helical = 边缘焊接"], a: 2, why: "Ameriflex 做液压成型，BellowsTech 做边缘焊接，Servometer 做电铸，Helical 做联轴器与万向节。" },
          { q: "波纹管在真空腔体上使用时，最需要校核的是？", opts: ["内压强度", "外压失稳", "扭矩", "转速"], a: 1, why: "外部大气压形成外压，长径比大时先失稳；同时还要考虑材料放气对真空度的影响。" },
          { q: "有效面积 A_eff 的计算式是？", opts: ["A = πD²", "A = F / P", "A = P / F", "A = F × P"], a: 1, why: "A_eff = F / P，是把「推力」与「压力」联系起来的核心公式。" },
          { q: "客户抱怨「价格是别家三倍」，最专业的回应是？", opts: ["立刻降价", "确认对方工艺与寿命等级是否一致", "说别家质量差", "推给老板"], a: 1, why: "不同工艺价差可达数倍。先对齐比较维度，再谈价格，才是专业做法。" },
          { q: "同样外径下，把壁厚减半，最可能发生的是？", opts: ["更耐压", "更灵敏但耐压下降、易失稳", "寿命变长", "成本下降"], a: 1, why: "壁厚减薄提高灵敏度与行程，但强度与稳定性下降，制造难度与成本反而上升。" },
          { q: "六参数里，决定工艺路线分叉的两个是？", opts: ["颜色与包装", "行程与压力", "交期与价格", "品牌与产地"], a: 1, why: "行程与压力直接决定选成型、焊接还是电铸，是方案的第一分叉点。" },
          { q: "模具费 8,000 美元、批量 100 件，单件摊销是？", opts: ["8 美元", "80 美元", "800 美元", "8,000 美元"], a: 1, why: "8000 ÷ 100 = 80 美元/件。批量越小，摊销越高，这是小批量报价高的核心原因。" },
          { q: "长径比 4 的波纹管，最应该增加什么？", opts: ["壁厚", "导向或加强环", "颜色", "包装"], a: 1, why: "长径比 3–5 属于高风险区，必须通过导向、加强环或多段结构抑制侧向失稳。" },
          { q: "客户说「上次三个月就裂了」，你应该先？", opts: ["道歉并赔偿", "按顺序追问行程、偏心、介质、真空、裂口位置", "换材料再试", "降价"], a: 1, why: "先定位失效模式，再谈责任与整改。五问能快速区分是选型问题、安装问题还是产品问题。" },
          { q: "把产品讲给客户听时，最有效的结构是？", opts: ["先报价格，再讲参数", "先讲工况与风险，再给方案与依据", "只讲品牌历史", "只发样本 PDF"], a: 1, why: "客户关心的是他的设备会不会出问题。从工况切入、用风险建立必要性、再给方案，才是有说服力的表达。" }
        ]
      }
    }
  }
};

</script>
<script>
/* ============================================================
   MW 销售工程师训练营 · 站点逻辑
   无依赖、无构建、file:// 直接打开可用
   ============================================================ */
(function () {
  "use strict";

  var C = window.COURSE;
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  /* ---------------- 工具 ---------------- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function md(s) {
    return esc(s)
      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
      .replace(/`([^`]+)`/g, "<code>$1</code>");
  }
  function num(x, d) {
    if (x == null || !isFinite(x)) return "—";
    return Number(x.toFixed(d)).toLocaleString("zh-CN");
  }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function fmtDate(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function fmtCN(d) { return (d.getMonth() + 1) + " 月 " + d.getDate() + " 日"; }

  /* ---------------- 课表 ---------------- */
  var SCHEDULE = (function () {
    var out = [], d = new Date(C.meta.startDate + "T00:00:00");
    while (out.length < C.meta.totalDays) {
      var wd = d.getDay();
      if (wd !== 0 && wd !== 6) {
        out.push(new Date(d.getFullYear(), d.getMonth(), d.getDate(), C.meta.unlockHour, 0, 0));
      }
      d.setDate(d.getDate() + 1);
    }
    return out;
  })();

  function unlockAt(id) { return SCHEDULE[id - 1]; }
  function isUnlocked(id) { return Date.now() >= unlockAt(id).getTime(); }
  function todayId() {
    var id = 0;
    for (var i = 1; i <= C.meta.totalDays; i++) { if (isUnlocked(i)) id = i; }
    return id; // 0 表示还没开课
  }
  function hasContent(id) { return !!(C.content && C.content[id]); }

  /* ---------------- 状态 ---------------- */
  function load(k, def) {
    try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; }
  }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }

  var done = load("mw.done", []);
  if (!Array.isArray(done)) done = [];
  var theme = load("mw.theme", "light");
  var examStore = load("mw.exam", {});
  if (!examStore || typeof examStore !== "object") examStore = {};

  function applyTheme(t) {
    theme = t;
    document.documentElement.setAttribute("data-theme", t);
    save("mw.theme", t);
  }
  applyTheme(theme);

  /* ---------------- 路由 ---------------- */
  function route() {
    var h = location.hash.replace(/^#\/?/, "") || "home";
    var parts = h.split("/");
    return { name: parts[0] || "home", arg: parts[1] || "" };
  }

  function setActiveNav(name) {
    $$("[data-nav]").forEach(function (a) {
      a.classList.toggle("on", a.getAttribute("data-nav") === name);
    });
  }

  /* ---------------- 视图：首页 ---------------- */
  function viewHome() {
    var tid = todayId();
    var nextId = Math.min(tid + 1, C.meta.totalDays);
    var unlockedCount = tid;
    var pct = Math.round(done.length / C.meta.totalDays * 100);

    var html = "";
    html += '<section class="hero">';
    html += '<p class="eyebrow">' + esc(C.meta.title) + "</p>";
    html += "<h1>从产品认知，<br>到<em>技术方案的说服力</em></h1>";
    html += "<p>60 个工作日，每天 1 小时。围绕产品、行业与方案三层能力展开：读懂参数，理解工况，给出能被客户工程团队接受的方案。</p>";
    html += '<div class="hero-actions">';
    if (tid > 0) {
      html += '<a class="btn btn-primary" href="#/lesson/' + tid + '">' + (done.indexOf(tid) >= 0 ? "复习第 " + tid + " 课" : "开始第 " + tid + " 课") + "</a>";
    } else {
      html += '<a class="btn btn-primary" href="#/plan">查看课程表</a>';
    }
    html += '<a class="btn btn-ghost" href="#/plan">看完整课表</a>';
    html += "</div>";

    html += '<div class="stats">';
    html += '<div class="stat"><b>' + done.length + "</b><span>已完成课时</span></div>";
    html += '<div class="stat"><b>' + unlockedCount + "</b><span>已解锁</span></div>";
    html += '<div class="stat"><b>' + pct + "%</b><span>总进度</span></div>";
    html += "</div>";
    html += "</section>";

    // 今日
    if (tid > 0) {
      var L = C.content[tid] || {};
      var meta = C.lessons[tid - 1];
      html += '<section class="section">';
      html += '<div class="section-h"><h2>今日课程</h2><span class="more">' + fmtCN(unlockAt(tid)) + " 09:00 解锁</span></div>";
      html += '<div class="today">';
      html += "<div>";
      html += '<span class="today-tag">DAY ' + tid + " · 第 " + meta.week + " 周</span>";
      html += "<h3>" + esc(L.title || meta.t) + "</h3>";
      html += "<p>" + esc(L.sub ? L.sub.slice(0, 62) + "…" : meta.focus) + "</p>";
      html += '<div class="today-meta"><span><i class="dot"></i>约 60 分钟</span><span>' + esc(meta.focus) + "</span></div>";
      html += "</div>";
      html += '<a class="btn btn-primary" href="#/lesson/' + tid + '">' + (done.indexOf(tid) >= 0 ? "已完成 · 去复习" : "进入学习") + "</a>";
      html += "</div></section>";
    } else {
      html += '<section class="section"><div class="today"><div><span class="today-tag">未开课</span><h3>第 1 课将在 ' + fmtCN(unlockAt(1)) + " 09:00 解锁</h3><p>可以先看看课程表，了解 12 周的路线。</p></div><a class=\"btn btn-primary\" href=\"#/plan\">查看课程表</a></div></section>";
    }

    // 本周
    var curWeek = tid > 0 ? C.lessons[tid - 1].week : 1;
    html += '<section class="section">';
    html += '<div class="section-h"><h2>本周 · 第 ' + curWeek + " 周</h2><span class=\"more\">" + esc(C.weeks[curWeek - 1].theme) + "</span></div>";
    html += '<div class="weeks">' + weekCard(curWeek) + "</div>";
    html += "</section>";

    // 下一课预告
    if (tid > 0 && nextId > tid) {
      var nm = C.lessons[nextId - 1];
      html += '<section class="section"><div class="section-h"><h2>下一课</h2><span class="more">' + fmtCN(unlockAt(nextId)) + " 09:00</span></div>";
      html += '<div class="today"><div><span class="today-tag">DAY ' + nextId + "</span><h3>" + esc(nm.t) + "</h3><p>" + esc(nm.focus) + "</p></div>";
      html += '<a class="btn btn-ghost" href="#/lesson/' + nextId + '">预览</a></div></section>';
    }

    return html;
  }

  function weekCard(n) {
    var w = C.weeks[n - 1];
    var ids = C.lessons.filter(function (l) { return l.week === n; });
    var doneN = ids.filter(function (l) { return done.indexOf(l.id) >= 0; }).length;
    var html = '<div class="week">';
    html += '<div class="week-h"><span class="week-n">W' + n + "</span><h3>" + esc(w.theme) + '</h3><span class="cnt">' + doneN + "/" + ids.length + "</span></div>";
    html += '<ul class="lessons">';
    ids.forEach(function (l) {
      var st = "锁定", cls = "locked", href = "#/lesson/" + l.id, tag = "🔒 " + fmtCN(unlockAt(l.id));
      if (done.indexOf(l.id) >= 0) { st = "已完成"; cls = "done"; tag = "✓ 已完成"; }
      else if (isUnlocked(l.id)) { st = "可学习"; cls = ""; tag = hasContent(l.id) ? "可学习" : "内容制作中"; }
      if (isUnlocked(l.id) && l.id === todayId()) { cls += " today"; }
      html += '<li><a class="lesson-row ' + cls + '" href="' + href + '">';
      html += '<span class="idx">' + l.id + "</span>";
      html += '<span class="t">' + esc(l.t) + "<small>" + esc(l.focus) + "</small></span>";
      html += '<span class="st">' + tag + "</span>";
      html += "</a></li>";
    });
    html += "</ul></div>";
    return html;
  }

  /* ---------------- 视图：课程表 ---------------- */
  function viewPlan() {
    var html = '<h1 style="font-size:clamp(22px,4vw,30px);margin:0 0 6px">60 个工作日，12 周</h1>';
    html += '<p style="color:var(--muted);margin:0 0 8px;max-width:64ch">前 4 周建立产品硬知识，中间 4 周进入行业应用，最后 4 周转向销售工程化。每天 09:00 解锁一课，周末休息。</p>';
    html += '<p class="fine" style="margin-bottom:18px">进度会保存在本机浏览器；换设备不同步。</p>';
    var grouped = {};
    C.lessons.forEach(function (l) { (grouped[l.week] = grouped[l.week] || []).push(l); });
    html += '<div class="weeks">';
    for (var n = 1; n <= C.weeks.length; n++) html += weekCard(n);
    html += "</div>";
    return html;
  }

  /* ---------------- 视图：学习法 ---------------- */
  function viewMethod() {
    return '' +
      '<h1 style="font-size:clamp(22px,4vw,30px);margin:0 0 10px">怎么用这套课，才不白学</h1>' +
      '<p style="color:var(--muted);max-width:64ch;margin:0 0 22px">这不是“看完就行”的视频课。每天 60 分钟，我建议你按下面的结构走。</p>' +
      '<div class="cards">' +
      '<div class="card"><h4>① 10 分钟 · 读概念</h4><p>先看开头和图示，别急着背参数。目标是“能用自己的话复述”。</p></div>' +
      '<div class="card"><h4>② 20 分钟 · 动手</h4><p>用页面里的计算器/模拟器改几个数，看结果怎么变。手感比记忆牢。</p></div>' +
      '<div class="card"><h4>③ 15 分钟 · 做题</h4><p>自测题先自己想，再点开答案。答错的，回去看对应小节。</p></div>' +
      '<div class="card"><h4>④ 10 分钟 · 说话</h4><p>把当天的话术念一遍，最好录音。销售的知识只有在“说出口”时才算掌握。</p></div>' +
      '<div class="card"><h4>⑤ 5 分钟 · 打卡</h4><p>点“完成本课”，写一句你今天最大的收获。进度会记住。</p></div>' +
      '<div class="card"><h4>周末 · 复盘</h4><p>周五的复盘课不要跳。它是把五天内容压成一张图的关键。</p></div>' +
      "</div>" +
      '<div class="callout key" style="margin-top:24px"><div class="co-t">一条原则</div><p>**宁可一天只学懂一个概念，也不要一天翻完十页。** 你的目标不是“看过”，是能在客户面前说出来。</p></div>' +
      '<h2 style="margin-top:34px;font-size:20px">关于更新</h2>' +
      '<p style="color:var(--ink-2)">课程按工作日 09:00 自动解锁。提前打开会看到锁定页和预计解锁时间，这是正常的。</p>' +
      '<p style="color:var(--ink-2)">所有图示与计算器都是离线可用的；断网、出差都不影响。</p>';
  }

  /* ---------------- 视图：课程 ---------------- */
  function viewLesson(id) {
    id = parseInt(id, 10);
    var meta = C.lessons[id - 1];
    if (!meta) return '<div class="locked-view"><h2>没有这一课</h2><p>课号应在 1–' + C.meta.totalDays + " 之间。</p><p style=\"margin-top:16px\"><a class=\"btn btn-ghost\" href=\"#/plan\">返回课程表</a></p></div>";

    if (!isUnlocked(id)) {
      return '<div class="crumb"><a href="#/plan">课程表</a> / 第 ' + id + " 课</div>" +
        '<div class="locked-view">' +
        '<div class="lock-ico"><svg viewBox="0 0 24 24" width="26" height="26"><rect x="4" y="10" width="16" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></div>' +
        "<h2>第 " + id + " 课还没解锁</h2>" +
        "<p>" + esc(meta.t) + "</p>" +
        '<p class="when">' + fmtCN(unlockAt(id)) + " 09:00 解锁</p>" +
        '<p class="fine">每课在工作日 09:00 自动开放，周末不更新。</p>' +
        '<p style="margin-top:18px"><a class="btn btn-ghost" href="#/lesson/' + Math.max(1, todayId()) + '">去看今天的课</a></p>' +
        "</div>";
    }

    var L = C.content[id];
    if (!L) {
      return '<div class="crumb"><a href="#/plan">课程表</a> / 第 ' + id + " 课</div>" +
        '<div class="locked-view"><div class="lock-ico">✎</div><h2>内容制作中</h2><p>' + esc(meta.t) + "</p>" +
        '<p class="fine">这一课已到解锁时间，但正文还在写。通常当天上午会补齐。</p>' +
        '<p style="margin-top:18px"><a class="btn btn-ghost" href="#/plan">返回课程表</a></p></div>';
    }

    var toc = [];
    L.blocks.forEach(function (b, i) { if (b.t === "h2") toc.push({ i: i, x: b.x }); });

    var html = '<div class="crumb"><a href="#/plan">课程表</a> / 第 ' + meta.week + ' 周 / <span style="color:var(--ink-2)">DAY ' + id + "</span></div>";
    html += '<div class="lesson-wrap">';

    // 侧栏
    html += '<aside class="toc"><h4>本课目录</h4><ol>';
    toc.forEach(function (t, k) {
      html += '<li><a href="#/lesson/' + id + '" data-scroll="h-' + k + '">' + esc(t.x) + "</a></li>";
    });
    html += "</ol>";
    html += '<div class="toc-prog">' + (done.indexOf(id) >= 0 ? "✓ 已完成本课" : "约 60 分钟") + "</div>";
    html += "</aside>";

    // 正文
    html += '<article class="article">';
    html += '<header class="art-head">';
    html += '<div class="art-kicker"><span class="chip brand">DAY ' + id + '</span><span class="chip">第 ' + meta.week + ' 周</span>';
    (L.tags || []).forEach(function (t) { html += '<span class="chip">' + esc(t) + "</span>"; });
    html += '<span class="chip warm">约 60 分钟</span></div>';
    html += "<h1>" + esc(L.title) + "</h1>";
    html += '<p class="sub">' + md(L.sub) + "</p>";
    html += "</header>";

    if (L.objectives && L.objectives.length) {
      html += '<div class="objectives"><h4>学完你会</h4><ol>';
      L.objectives.forEach(function (o) { html += "<li>" + md(o) + "</li>"; });
      html += "</ol></div>";
    }

    var hCount = 0;
    L.blocks.forEach(function (b) {
      if (b.t === "h2") { html += renderBlock(b, "h-" + (hCount++)); }
      else { html += renderBlock(b); }
    });

    if (L.exam) html += examSection(L.exam, id);

    html += '<div class="art-foot"><div class="done-row">';
    html += '<button class="done-btn' + (done.indexOf(id) >= 0 ? " is-done" : "") + '" id="doneBtn" type="button">' +
      (done.indexOf(id) >= 0 ? "✓ 已完成本课" : "标记完成本课") + "</button>";
    html += '<span class="fine">完成的课时会计入总进度</span>';
    html += "</div>";

    var prev = id > 1 ? id - 1 : null, next = id < C.meta.totalDays ? id + 1 : null;
    html += '<div class="nextnav">';
    html += prev
      ? '<a href="#/lesson/' + prev + '"><span class="lbl">上一课</span><span class="tt">' + esc(C.lessons[prev - 1].t) + "</span></a>"
      : '<a class="disabled"><span class="lbl">上一课</span><span class="tt">已经是第一课</span></a>';
    html += next
      ? '<a href="#/lesson/' + next + '"><span class="lbl">下一课</span><span class="tt">' + esc(C.lessons[next - 1].t) + "</span></a>"
      : '<a class="disabled"><span class="lbl">下一课</span><span class="tt">全部课程结束</span></a>';
    html += "</div></div>";
    html += "</article></div>";
    return html;
  }

  /* ---------------- 课后测验 ---------------- */
  function examSection(e, id) {
    var n = e.questions.length;
    var pass = e.pass || 80;
    var best = examStore[id];
    var h = '<section class="exam" id="exam" data-exam="' + id + '" data-pass="' + pass + '">';
    h += '<div class="exam-h"><div><h3>课后测验</h3><p>共 ' + n + " 题 · 建议 " + (e.minutes || 10) + " 分钟 · " + pass + " 分及格</p></div>";
    if (best != null) h += '<span class="chip brand">最佳成绩 ' + best + " 分</span>";
    h += "</div>";
    if (e.intro) h += '<p class="exam-intro">' + md(e.intro) + "</p>";
    h += '<div class="scorecard" hidden></div>';
    h += '<div class="qlist">';
    e.questions.forEach(function (q, i) {
      h += '<div class="qcard" data-a="' + q.a + '">';
      h += '<div class="qstem"><span class="qno">' + (i + 1) + "</span><span>" + md(q.q) + "</span></div>";
      h += '<div class="opts" role="group" aria-label="第 ' + (i + 1) + ' 题选项">';
      q.opts.forEach(function (o, k) {
        h += '<button type="button" class="opt" data-i="' + k + '"><span class="k">' + "ABCD".charAt(k) +
          '</span><span class="ot">' + md(o) + "</span></button>";
      });
      h += "</div>";
      h += '<div class="qres"></div>';
      h += '<div class="explain"><b>解析</b>' + md(q.why) + "</div>";
      h += "</div>";
    });
    h += "</div>";
    h += '<div class="exam-foot"><button type="button" class="btn btn-primary exam-submit">提交试卷</button>';
    h += '<button type="button" class="btn btn-ghost exam-retry" hidden>重做一次</button>';
    h += '<span class="exam-hint">提交后自动判分，并显示每道题的解析</span></div>';
    h += "</section>";
    return h;
  }

  function initExam(root) {
    var box = $("[data-exam]", root);
    if (!box) return;
    box.addEventListener("click", function (e) {
      var t = e.target;
      var opt = t.closest ? t.closest(".opt") : null;
      if (opt) {
        if (box.classList.contains("graded")) return;
        var card = opt.closest(".qcard");
        $$(".opt", card).forEach(function (o) { o.classList.remove("sel"); o.setAttribute("aria-pressed", "false"); });
        opt.classList.add("sel");
        opt.setAttribute("aria-pressed", "true");
        card.classList.add("answered");
        return;
      }
      if (t.closest(".exam-submit")) gradeExam(box);
      else if (t.closest(".exam-retry")) resetExam(box);
    });
  }

  function gradeExam(box) {
    var id = parseInt(box.getAttribute("data-exam"), 10);
    var pass = parseInt(box.getAttribute("data-pass"), 10) || 80;
    var cards = $$(".qcard", box);
    var correct = 0, blank = 0;
    cards.forEach(function (c) {
      var right = parseInt(c.getAttribute("data-a"), 10);
      var sel = $(".opt.sel", c);
      var pick = sel ? parseInt(sel.getAttribute("data-i"), 10) : -1;
      if (pick < 0) blank++;
      var ok = pick === right;
      if (ok) correct++;
      c.classList.add("graded");
      $$(".opt", c).forEach(function (o) {
        var oi = parseInt(o.getAttribute("data-i"), 10);
        if (oi === right) o.classList.add("correct");
        if (oi === pick && !ok) o.classList.add("wrong");
      });
      var res = $(".qres", c);
      res.className = "qres on";
      res.innerHTML = ok
        ? '<span class="ok">✓ 回答正确</span>'
        : '<span class="bad">✗ ' + (pick < 0 ? "未作答" : "回答错误") + "，正确答案是 " + "ABCD".charAt(right) + "</span>";
    });

    var total = cards.length;
    var pct = Math.round(correct / total * 100);
    var passed = pct >= pass;
    var sc = $(".scorecard", box);
    sc.hidden = false;
    sc.className = "scorecard " + (passed ? "pass" : "fail");
    sc.innerHTML = '<div class="sc-main"><div class="sc-num">' + pct + "<span>分</span></div>" +
      '<div class="sc-info"><b>' + (passed ? "通过" : "未通过") + "</b><p>答对 " + correct + " / " + total + " 题" +
      (blank ? "，未作答 " + blank + " 题" : "") + "；及格线 " + pass + " 分。</p></div></div>" +
      '<div class="sc-bar"><i style="width:' + pct + '%"></i></div>' +
      '<p class="sc-tip">' + (passed
        ? "掌握得不错，可以进入下一课。建议把解析再过一遍，巩固判断依据。"
        : "先看错题解析，回到对应小节重读，然后重做一次。") + "</p>";

    box.classList.add("graded");
    $(".exam-submit", box).hidden = true;
    var retry = $(".exam-retry", box);
    if (retry) retry.hidden = false;

    var prev = examStore[id];
    if (prev == null || pct > prev) { examStore[id] = pct; save("mw.exam", examStore); }
    sc.scrollIntoView({ behavior: "smooth", block: "center" });
  }

  function resetExam(box) {
    box.classList.remove("graded");
    $$(".qcard", box).forEach(function (c) {
      c.classList.remove("graded", "answered");
      $$(".opt", c).forEach(function (o) {
        o.classList.remove("sel", "correct", "wrong");
        o.setAttribute("aria-pressed", "false");
      });
      var r = $(".qres", c);
      if (r) { r.className = "qres"; r.innerHTML = ""; }
    });
    var sc = $(".scorecard", box);
    if (sc) { sc.hidden = true; sc.innerHTML = ""; }
    $(".exam-submit", box).hidden = false;
    var retry = $(".exam-retry", box);
    if (retry) retry.hidden = true;
    box.scrollIntoView({ behavior: "smooth", block: "start" });
  }

    }
  }

  function bellowsD(x0, x1, cy, amp, waves, color) {
    var step = (x1 - x0) / waves;
    var top = "M" + x0 + "," + cy, bot = "M" + x0 + "," + cy;
    for (var i = 0; i < waves; i++) {
      var xs = x0 + i * step;
      top += " q" + (step * 0.25) + "," + (-amp) + " " + (step * 0.5) + ",0";
      top += " q" + (step * 0.25) + "," + amp + " " + (step * 0.5) + ",0";
      bot += " q" + (step * 0.25) + "," + amp + " " + (step * 0.5) + ",0";
      bot += " q" + (step * 0.25) + "," + (-amp) + " " + (step * 0.5) + ",0";
    }
    return '<path d="' + top + '" fill="none" stroke="' + color + '" stroke-width="3" stroke-linecap="round"/>' +
      '<path d="' + bot + '" fill="none" stroke="' + color + '" stroke-width="3" stroke-linecap="round"/>';
  }

  function initWidgets(root) {
    var bw = $('[data-widget="bellows"]', root);
    if (bw) {
      var range = $("#bwRange", bw), svg = $("#bwSvg", bw), out = $("#bwOut", bw);
      var draw = function () {
        var c = parseInt(range.value, 10);
        var x0 = 60, x1 = 560;
        var len = (x1 - x0) * (1 - c / 100);
        var xEnd = x0 + len;
        var amp = 26 * (1 + c / 110);
        var cy = 95;
        var g = bellowsD(x0, xEnd, cy, amp, 8, "var(--brand)");
        svg.innerHTML =
          '<rect x="26" y="52" width="24" height="86" rx="5" fill="var(--line-2)"/>' +
          '<rect x="' + (xEnd + 10) + '" y="52" width="24" height="86" rx="5" fill="var(--line-2)"/>' +
          '<rect x="' + (x0 - 4) + '" y="56" width="' + (len + 8) + '" height="78" rx="6" fill="var(--brand-soft)" opacity=".5"/>' +
          g +
          '<line x1="' + x0 + '" y1="158" x2="' + xEnd + '" y2="158" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4"/>' +
          '<text x="' + (x0 + len / 2) + '" y="176" text-anchor="middle" font-size="11.5" fill="var(--muted)">压缩后长度</text>' +
          '<text x="310" y="24" text-anchor="middle" font-size="12" fill="var(--brand)" font-weight="700">' +
          (c === 0 ? "自由状态" : "压缩 " + c + "%") + "</text>";

        var ratio = c;
        var cls = ratio > 40 ? "bad" : ratio > 25 ? "mid" : "ok";
        var txt = ratio > 40 ? "行程比过高：多数工艺寿命会急剧下降，需要重新评估波数或直径。"
          : ratio > 25 ? "行程比偏高：焊接件尚可评估，成型/电铸要谨慎。"
            : "行程比温和：常规设计区间。";
        out.innerHTML =
          row("压缩量", c + " %") +
          row("剩余长度", Math.round(100 - c) + " %") +
          row("行程比", c + " / 100") +
          '<div class="wverdict"><span class="' + cls + '">' + txt + "</span></div>";
      };
      range.addEventListener("input", draw);
      draw();
    }

    var aw = $('[data-widget="area"]', root);
    if (aw) {
      var F = $("#arF", aw), P = $("#arP", aw), D = $("#arD", aw), o = $("#arOut", aw);
      var calc = function () {
        var f = parseFloat(F.value), p = parseFloat(P.value), d = parseFloat(D.value);
        if (!(f > 0) || !(p > 0)) {
          o.innerHTML = '<span class="bad">请输入大于 0 的推力与压力。</span>';
          return;
        }
        var A = f / (p * 0.1);              // bar → N/mm²
        var deq = Math.sqrt(4 * A / Math.PI);
        var full = d > 0 ? Math.PI * d * d / 4 : 0;
        var share = full > 0 ? A / full * 100 : 0;
        var cls = share > 85 ? "bad" : share > 70 ? "mid" : "ok";
        var txt = share > 85 ? "面积占比过高：外径偏小，实际做不出来，建议加大外径或降低推力。"
          : share > 70 ? "面积占比偏高：可行区间上沿，需要工程确认。"
            : "面积占比合理，方案有实现空间。";
        o.innerHTML =
          row("有效面积 A_eff", num(A, 0) + " mm²") +
          row("等效直径", num(deq, 1) + " mm") +
          (full > 0 ? row("外径全截面", num(full, 0) + " mm²") : "") +
          (full > 0 ? row("面积占比", num(share, 0) + " %") : "") +
          '<div class="wverdict"><span class="' + cls + '">' + txt + "</span></div>";
      };
      [F, P, D].forEach(function (el) { el.addEventListener("input", calc); });
      calc();
    }
  }

  function row(k, v) {
    return '<div class="wrow"><span class="k">' + k + '</span><span class="v">' + v + "</span></div>";
  }

  /* ---------------- 渲染 ---------------- */
  function render() {
    var r = route();
    var app = $("#app");
    var html = "";
    if (r.name === "lesson") { html = viewLesson(r.arg); }
    else if (r.name === "plan") { html = viewPlan(); }
    else if (r.name === "method") { html = viewMethod(); }
    else { html = viewHome(); }

    app.innerHTML = html;
    setActiveNav(r.name === "lesson" ? "plan" : r.name);

    if (r.name === "lesson") {
      initWidgets(app);
      initExam(app);
      var btn = $("#doneBtn");
      if (btn) {
        btn.addEventListener("click", function () {
          var id = parseInt(r.arg, 10);
          var i = done.indexOf(id);
          if (i >= 0) { done.splice(i, 1); } else { done.push(id); }
          save("mw.done", done);
          btn.classList.toggle("is-done", done.indexOf(id) >= 0);
          btn.textContent = done.indexOf(id) >= 0 ? "✓ 已完成本课" : "标记完成本课";
          updateHeader();
          toast(done.indexOf(id) >= 0 ? "已记录，明天继续" : "已取消完成标记");
        });
      }
      window.scrollTo({ top: 0, behavior: "auto" });
    } else {
      window.scrollTo({ top: 0, behavior: "auto" });
    }
    updateHeader();
    document.title = r.name === "lesson"
      ? "第 " + r.arg + " 课 · " + (C.lessons[r.arg - 1] ? C.lessons[r.arg - 1].t : "") + " · " + C.meta.title
      : C.meta.title;
  }

  function updateHeader() {
    var el = $("#hdrProgress");
    if (el) el.textContent = done.length + " / " + C.meta.totalDays;
  }

  /* ---------------- 杂项 ---------------- */
  var toastEl = null, toastTimer = null;
  function toast(msg) {
    if (!toastEl) {
      toastEl = document.createElement("div");
      toastEl.className = "toast";
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = msg;
    toastEl.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("on"); }, 1800);
  }

  function onScroll() {
    var h = document.documentElement;
    var max = h.scrollHeight - h.clientHeight;
    var p = max > 0 ? (h.scrollTop || document.body.scrollTop) / max * 100 : 0;
    var bar = $("#scrollBar");
    if (bar) bar.style.width = p + "%";
  }

  /* ---------------- 启动 ---------------- */
  function init() {
    var q = (location.search || "").match(/theme=(dark|light)/);
    if (q) applyTheme(q[1]);
    var tb = $("#themeBtn");
    if (tb) {
      tb.addEventListener("click", function () {
        applyTheme(theme === "light" ? "dark" : "light");
      });
    }
    // 目录跳转：不能用 hash，否则会触发路由
    document.addEventListener("click", function (e) {
      var a = e.target.closest ? e.target.closest("[data-scroll]") : null;
      if (!a) return;
      e.preventDefault();
      var el = document.getElementById(a.getAttribute("data-scroll"));
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    });
    window.addEventListener("hashchange", render);
    window.addEventListener("scroll", onScroll, { passive: true });
    if (!location.hash) location.replace("#/home");
    render();
    onScroll();
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();

</script>
</body>
</html>
